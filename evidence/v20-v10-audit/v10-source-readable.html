<script>
/* Daylio v8 schedule/capacity review: browser-only interactions, no API/provider side effects. */
(function(){
'use strict';
const SKEY='daylio-v8-scheduler-review';
const STAFF=[
 {id:'S1',name:'Maya',role:'Lead Caregiver',room:'Toddler A',hours:'07.00–15.00'},
 {id:'S2',name:'Tari',role:'Caregiver',room:'Toddler A',hours:'09.00–17.00'},
 {id:'S3',name:'Salsa',role:'Caregiver',room:'Toddler A',hours:'08.00–16.00'},
 {id:'S4',name:'Nadia',role:'Lead Caregiver',room:'Baby',hours:'07.00–15.00'},
 {id:'S5',name:'Winda',role:'Caregiver',room:'Baby',hours:'09.00–17.00'},
 {id:'S6',name:'Rina',role:'Lead Caregiver',room:'Pra-TK',hours:'07.00–15.00'},
 {id:'S7',name:'Dewi',role:'Caregiver',room:'Pra-TK',hours:'09.00–17.00'},
 {id:'S8',name:'Dini',role:'Floater',room:'Cadangan',hours:'08.00–16.00'}
];
const DAYS=['Sen','Sel','Rab','Kam','Jum'];
const RATIOS={'Baby':4,'Toddler A':6,'Pra-TK':8};
const SEED=[
 {id:'BK1',name:'Kunjungan keluarga Hana',child:'Hana',guardian:'Sinta Maharani',room:'Toddler A',week:0,day:0,type:'trial',time:'09.30–10.30',status:'confirmed'},
 {id:'BK2',name:'Drop-in Aira',child:'Aira',guardian:'Nina Pradana',room:'Baby',week:0,day:1,type:'dropin',time:'08.00–13.00',status:'confirmed'},
 {id:'BK3',name:'Trial Kirana',child:'Kirana',guardian:'Fitri Wijaya',room:'Pra-TK',week:0,day:2,type:'trial',time:'09.00–11.00',status:'confirmed'},
 {id:'BK4',name:'Extra day Rafael',child:'Rafael',guardian:'Ratna Wijaya',room:'Toddler A',week:0,day:4,type:'dropin',time:'08.00–16.00',status:'confirmed'},
 {id:'BK5',name:'Trial Arka',child:'Arka',guardian:'Lia Setiawan',room:'Baby',week:0,day:3,type:'trial',time:'09.00–10.00',status:'confirmed'}
];
function seedShifts(){const out=[];STAFF.filter(s=>s.room!=='Cadangan').forEach(s=>{for(let day=0;day<5;day++){if(s.id==='S2'&&day===3)continue;out.push({id:`SH-${s.id}-${day}`,staff:s.id,room:s.room,week:0,day,time:s.hours})}});return out;}
function makeState(){return {view:'week',filter:'Semua',weekOffset:0,selRoom:'Toddler A',selDay:3,bookings:SEED.map(x=>({...x})),shifts:seedShifts(),lastNotice:null}}
let sc;
try{const obj=JSON.parse(localStorage.getItem(SKEY)||'null');sc=obj&&Array.isArray(obj.bookings)&&Array.isArray(obj.shifts)?{...makeState(),...obj}:makeState()}catch(e){sc=makeState()}
function saveSC(){try{localStorage.setItem(SKEY,JSON.stringify(sc))}catch(e){}}
function getClasses(){return db.capacities||[]}
function cap(room){return getClasses().find(c=>c.name===room)||{name:room,total:0,filled:0,staff:0,age:''}}
function d0(){return new Date(2026,9,19,12,0,0)}
function actualDate(day,week=sc.weekOffset){const d=d0();d.setDate(d.getDate()+week*7+day);return d}
function datelabel(day,week=sc.weekOffset){return new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short'}).format(actualDate(day,week))}
function dateLong(day,week=sc.weekOffset){return new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(actualDate(day,week))}
function dateRange(){return `${datelabel(0)} – ${datelabel(4)} ${actualDate(4).getFullYear()}`}
function mask(v){return esc(String(v??''))}
function baseOcc(room,day){const c=cap(room);const mod=room==='Baby'?[0,-1,0,0,-1]:room==='Toddler A'?[0,0,-1,0,0]:[-1,-2,-1,-1,0];return Math.max(0,(c.filled||0)+mod[day])}
function dayBookings(room,day,week=sc.weekOffset){return sc.bookings.filter(b=>b.room===room&&b.day===day&&b.week===week&&b.status!=='cancelled')}
function bookingsOcc(room,day,week=sc.weekOffset,excludedId=null){return dayBookings(room,day,week).filter(b=>b.id!==excludedId).length}
function bookDateCount(room,day,week=sc.weekOffset,excludedId=null){return baseOcc(room,day)+bookingsOcc(room,day,week,excludedId)}
function staffShiftFor(staff,day,week=sc.weekOffset){const explicit=sc.shifts.filter(x=>x.staff===staff&&x.day===day&&x.week===week);if(explicit.length||week===0)return explicit;return sc.shifts.filter(x=>x.staff===staff&&x.day===day&&x.week===0).map(x=>({...x,week}))}
function shiftAt(room,day,week=sc.weekOffset){return STAFF.flatMap(s=>staffShiftFor(s.id,day,week)).filter(x=>x.room===room)}
function staffing(room,day,week=sc.weekOffset,extra=0){const children=bookDateCount(room,day,week)+extra;const staff=shiftAt(room,day,week).length;return {staff,required:Math.ceil(children/(RATIOS[room]||6)),children}}
function selected(){return {room:sc.selRoom,day:sc.selDay}}
function dot(color){return `<i style="background:${color}"></i>`}
function schicon(n,size=17){return ico(n,size)}
function weekEvents(){return sc.bookings.filter(x=>x.week===sc.weekOffset&&x.status!=='cancelled')}
function weekIssues(){let issues=[];for(let day=0;day<5;day++)for(const c of getClasses()){
 const count=bookDateCount(c.name,day),r=staffing(c.name,day);if(count>c.total)issues.push({kind:'capacity',room:c.name,day,desc:`${count}/${c.total} anak melebihi kapasitas.`});else if(r.staff<r.required)issues.push({kind:'coverage',room:c.name,day,desc:`${r.staff} dari ${r.required} pengasuh dibutuhkan.`});}
 return issues;
}
function scStat(title,value,note,icon,alert=false){return `<div class="sc-stat ${alert?'is-alert':''}"><div class="sc-stat-top"><span>${mask(title)}</span><span class="sc-stat-icon">${schicon(icon,16)}</span></div><strong>${mask(value)}</strong><small>${mask(note)}</small></div>`}
function scToolbar(){return `<div class="sc-toolbar"><div class="sc-weeknav"><button class="sc-button icon" data-sc="prev" aria-label="Minggu sebelumnya">${schicon('chevron',16).replace('rotate','')}</button><button class="sc-button" data-sc="now">Pekan contoh</button><button class="sc-button icon" data-sc="next" aria-label="Minggu berikutnya">${schicon('arrow',17)}</button><b>${dateRange()}</b></div><div class="sc-viewtabs" aria-label="Tampilan jadwal"><button data-sc="view" data-view="week" class="${sc.view==='week'?'active':''}">Minggu</button><button data-sc="view" data-view="day" class="${sc.view==='day'?'active':''}">Hari</button><button data-sc="view" data-view="staff" class="${sc.view==='staff'?'active':''}">Roster staf</button></div></div><div class="sc-filters"><div class="sc-filter-controls">${['Semua',...getClasses().map(x=>x.name)].map(x=>`<button class="sc-filter ${sc.filter===x?'active':''}" data-sc="filter" data-room="${mask(x)}">${mask(x)}</button>`).join('')}</div><div class="sc-smalllegend"><span>${dot('#96af9e')} Aman</span><span>${dot('#dfae67')} Trial / booking</span><span>${dot('#c76b5c')} Perlu penyesuaian</span></div></div>`}
function cellMarkup(room,day){const c=cap(room), count=bookDateCount(room,day),events=dayBookings(room,day),cover=staffing(room,day),pct=c.total?Math.min(100,count/c.total*100):0,conf=count>c.total||cover.staff<cover.required,selected=sc.selRoom===room&&sc.selDay===day;
 const staffLine=`${cover.staff}/${cover.required} pengasuh · ${Math.max(0,c.total-count)} slot`;
 return `<div role="button" tabindex="0" class="sc-cell ${selected?'selected':''} ${conf?'overbook':''}" data-sc="select" data-day="${day}" data-room="${mask(room)}" data-drop-room="${mask(room)}" data-drop-day="${day}" aria-label="${mask(room)} ${dateLong(day)}: ${count}/${c.total} anak, ${staffLine}"><div class="head"><strong>${count}<span style="font-weight:500;color:#9ba7a7"> / ${c.total}</span></strong>${conf?`<span class="sc-flag">${count>c.total?'Penuh':'Cek staf'}</span>`:''}</div><div class="sc-meter"><span style="width:${pct}%"></span></div><div class="sc-staffline">${staffLine}</div>${events.slice(0,2).map(e=>`<div class="sc-event ${e.type}" draggable="${appState.role!=='caregiver'}" data-booking-id="${mask(e.id)}" data-sc="editbooking" data-id="${mask(e.id)}" title="Geser untuk ubah hari atau kelas" aria-label="${mask(e.name)} ${mask(e.time)}">${e.type==='trial'?'◎':e.type==='dropin'?'◷':'○'} ${mask(e.name)}</div>`).join('')}${events.length>2?`<div class="sc-empty-slot">+${events.length-2} booking lainnya</div>`:''}${events.length===0?`<div class="sc-empty-slot">${schicon('plus',12)} Tambah booking</div>`:''}</div>`}
function weekView(){const cls=getClasses().filter(c=>sc.filter==='Semua'||c.name===sc.filter);return `<div class="sc-mobilehint">↔ Geser untuk melihat seluruh hari · Tap sel untuk detail</div><div class="sc-tablewrap"><div class="sc-grid"><div class="sc-gridhead"><div class="daylabel">Kelas / Ruang</div><small>Rangkuman per hari</small></div>${DAYS.map((x,i)=>`<div class="sc-gridhead"><div class="daylabel">${x} · ${datelabel(i)}</div><small>${i===3?'Perlu review':'Tap untuk detail'}</small></div>`).join('')}${cls.map(c=>`<div class="sc-roomlead"><strong>${mask(c.name)}</strong><small>${mask(c.age)}</small><small>${c.total} kapasitas</small><span class="sc-roomtag">${mask(`Rasio ilustratif 1:${RATIOS[c.name]||6}`)}</span></div>${DAYS.map((d,day)=>cellMarkup(c.name,day)).join('')}`).join('')}</div></div>`}
function dayView(){const days=DAYS.map((x,i)=>`<button class="sc-filter ${i===sc.selDay?'active':''}" data-sc="selectday" data-day="${i}">${x} · ${datelabel(i)}</button>`).join(''),cls=getClasses().filter(c=>sc.filter==='Semua'||c.name===sc.filter);return `<div class="sc-filters" style="padding-top:1px"><div class="sc-filter-controls">${days}</div></div><div class="sc-dayview">${cls.map(c=>{const r=staffing(c.name,sc.selDay),events=dayBookings(c.name,sc.selDay),count=bookDateCount(c.name,sc.selDay);return `<article class="sc-daycard"><div><h3>${mask(c.name)}</h3><small>${mask(c.age)}</small><div class="sc-daybar"><span style="width:${Math.min(100,count/c.total*100)}%"></span></div></div><div><div style="font-size:12px;font-weight:850">${count}/${c.total} anak · ${r.staff}/${r.required} staf</div><small>${events.length?events.map(e=>e.name+' ('+e.time+')').join(' · '):'Belum ada trial/extra day pada hari ini'}</small></div><button class="sc-button" data-sc="select" data-room="${mask(c.name)}" data-day="${sc.selDay}">Detail ${schicon('arrow',14)}</button></article>`}).join('')}</div>`}
function staffView(){return `<div class="sc-rosterwrap"><div class="sc-roster"><div class="sc-gridhead"><div class="daylabel">Pengasuh</div><small>Tap shift untuk edit</small></div>${DAYS.map((d,i)=>`<div class="sc-gridhead"><div class="daylabel">${d} · ${datelabel(i)}</div><small>${i===3?'Kekurangan cover Toddler':''}</small></div>`).join('')}${STAFF.map(s=>`<div class="sc-staffname">${mask(s.name)}<small>${mask(s.role)}</small><small>${mask(s.room)}</small></div>${DAYS.map((d,day)=>{const entries=staffShiftFor(s.id,day,sc.weekOffset);return `<button class="sc-roster-cell" data-sc="editshift" data-staff="${mask(s.id)}" data-day="${day}">${entries.length?entries.map(x=>`<span class="sc-shiftbadge">${mask(x.room)}<br>${mask(x.time)}</span>`).join(''):`<span class="sc-shiftbadge warn">+ Atur shift</span>`}</button>`}).join('')}`).join('')}</div></div>`}
function sidePanel(){const room=sc.selRoom,day=sc.selDay,c=cap(room),count=bookDateCount(room,day),events=dayBookings(room,day),r=staffing(room,day),available=Math.max(0,c.total-count),staffNames=shiftAt(room,day).map(z=>STAFF.find(x=>x.id===z.staff)?.name||z.staff).join(' · ')||'Belum ada';let issues=weekIssues();const selectedIssues=issues.filter(x=>x.room===room&&x.day===day);return `<aside class="sc-side"><section class="sc-sidepanel"><div class="sc-sidepanel-header"><small>DETAIL KAPASITAS</small><h3>${mask(room)} · ${DAYS[day]}</h3><p>${dateLong(day)} · ${mask(c.age)}</p></div><div class="sc-sidepanel-body"><div class="sc-minirow"><span>Terjadwal</span><strong>${count} dari ${c.total} anak</strong></div><div class="sc-minirow"><span>Sisa slot</span><strong>${available} slot</strong></div><div class="sc-minirow"><span>Pengasuh bertugas</span><strong style="color:${r.staff<r.required?'#b6594f':'#387560'}">${r.staff} / ${r.required} dibutuhkan</strong></div><p style="font-size:10px;color:#78898d;line-height:1.6;margin:12px 0 4px">${mask(staffNames)}</p>${events.length?`<div style="margin:12px 0 8px;font-size:11px;font-weight:850">Booking khusus</div>${events.map(e=>`<div class="sc-minirow"><span>${mask(e.child)} · ${mask(e.time)}</span><button class="sc-button" data-sc="editbooking" data-id="${mask(e.id)}" style="min-height:29px;padding:6px 8px;font-size:10px">Ubah</button></div>`).join('')}`:''}${appState.role!=='caregiver'?`<button class="sc-button primary" data-sc="newbooking" style="width:100%;margin-top:14px">${schicon('plus',15)} Tambah trial / booking</button>`:''}</div></section><section class="sc-sidepanel"><div class="sc-sidepanel-header"><small>LEO · TINDAKAN RELEVAN</small><h3>${issues.length?`${issues.length} hal perlu ditinjau`:'Jadwal terkendali'}</h3><p>Rekomendasi rule-based dari data kalender demo.</p></div><div class="sc-sidepanel-body">${issues.slice(0,3).map(x=>`<div class="sc-issue"><div class="sc-issue-title">${schicon('alert',15)} ${mask(DAYS[x.day])} · ${mask(x.room)}</div><p>${mask(x.desc)}</p><button data-sc="issue" data-room="${mask(x.room)}" data-day="${x.day}">Tinjau & atur staf ${schicon('arrow',13)}</button></div>`).join('')||`<div class="sc-insight"><span class="sc-chip">SEMUA TERCAKUP</span><strong>Tidak ada konflik pada minggu yang dipilih</strong><p>Periksa juga instruksi individual sebelum mengonfirmasi booking.</p></div>`}<div class="sc-insight"><span class="sc-chip">PELUANG ENROLLMENT</span><strong>${available} slot tersedia untuk ${mask(room)} di ${mask(DAYS[day])}.</strong><p>Cocokkan dengan prospek di CRM; booking baru tetap memerlukan konfirmasi staf.</p><button class="sc-button" data-sc="opencrm" style="margin-top:10px;width:100%">Buka CRM ${schicon('arrow',14)}</button></div></div></section></aside>`}
function miniGraph(){return `<div class="sc-occupancy-graph">${DAYS.map((d,day)=>{const filled=getClasses().reduce((s,c)=>s+bookDateCount(c.name,day),0),total=getClasses().reduce((s,c)=>s+c.total,0),pc=Math.round(filled/total*100);return `<div class="sc-gitem"><div class="barbox"><span style="height:${pc}%"></span></div><div><b>${pc}%</b><small>${d}</small></div></div>`}).join('')}</div>`}
function schedulerUI(){const sum=getClasses().reduce((s,c)=>s+c.total,0),avg=Math.round(DAYS.reduce((s,d,i)=>s+getClasses().reduce((t,c)=>t+bookDateCount(c.name,i),0),0)/5),issues=weekIssues(),special=weekEvents().length;return `<main class="sc-app"><div class="sc-topbar"><div><span class="sc-eyebrow">DAYLIO · OPERATIONS / SCHEDULING</span><h1>Jadwal yang jelas. Kapasitas terkendali.</h1><p>Atur kelas, penugasan pengasuh, dan booking tanpa bentrok. Klik sel untuk detail atau geser booking ke hari lain.</p></div><div class="sc-actions"><span class="sc-demo-label">Data simulasi · tidak live</span>${appState.role!=='caregiver'?`<button class="sc-button" data-sc="staffnew">${schicon('users',15)} Atur shift</button><button class="sc-button primary" data-sc="newbooking">${schicon('plus',15)} Booking baru</button>`:''}</div></div><div class="sc-shellstats">${scStat('Rata-rata hadir terjadwal',String(avg)+'/'+sum,'Anak per hari kerja','users')}${scStat('Booking khusus',String(special),'Trial & extra-day pada minggu ini','calendar')}${scStat('Perlu penyesuaian',String(issues.length),'Cek kapasitas dan cakupan staf','alert',issues.length>0)}${scStat('Slot tersedia',String(Math.max(0,sum-getClasses().reduce((t,c)=>t+bookDateCount(c.name,sc.selDay),0))),'Total kapasitas semua kelas: '+sum,'chart')}</div><div class="sc-workspace"><section class="sc-main">${scToolbar()}${sc.view==='week'?weekView():sc.view==='day'?dayView():staffView()}${sc.view==='week'?miniGraph():''}<div class="sc-footnote">Basis anak terdaftar menggunakan angka agregat ilustratif; booking khusus disimpan lokal dan tidak membuat invoice otomatis. Kebutuhan jumlah pengasuh pada contoh adalah konfigurasi demo, bukan klaim rasio wajib.</div></section>${sidePanel()}</div></main>`}
function shellModal(title,subtitle,body,footer){let root=document.getElementById('sc-modal-root');if(!root){root=document.createElement('div');root.id='sc-modal-root';document.body.appendChild(root)}root.innerHTML=`<div class="sc-modalback" data-sc="backdrop"><section class="sc-modal" role="dialog" aria-modal="true" aria-label="${mask(title)}"><div class="sc-modal-head"><div><h2>${mask(title)}</h2><p>${mask(subtitle)}</p></div><button class="sc-button icon" data-sc="close" aria-label="Tutup dialog">×</button></div>${body}<div class="sc-modalfoot"><button class="sc-button" data-sc="close">Batal</button>${footer}</div></section></div>`}
function closeModalSC(){const root=document.getElementById('sc-modal-root');if(root)root.innerHTML=''}
function bookingModal(item=null){const b=item||{room:sc.selRoom,day:sc.selDay,week:sc.weekOffset,type:'trial',time:'09.00–11.00',name:'',child:'',guardian:''};shellModal(item?'Ubah jadwal booking':'Tambah booking daycare',item?'Pindahkan, ubah jenis, atau batalkan booking.':'Konfirmasi kapasitas dan penugasan staf sebelum menerima booking.',`<form id="sc-booking-form" class="sc-modal-body"><input type="hidden" name="bookingId" value="${mask(item?.id||'')}"><div class="sc-formgrid"><div class="sc-formfield"><label>Nama anak</label><input name="child" maxlength="65" placeholder="Contoh: Hana" value="${mask(b.child)}" required></div><div class="sc-formfield"><label>Nama wali / kontak</label><input name="guardian" maxlength="90" placeholder="Contoh: Sinta Maharani" value="${mask(b.guardian)}" required></div></div><div class="sc-formgrid"><div class="sc-formfield"><label>Kelas</label><select name="room" id="sc-input-room">${getClasses().map(c=>`<option value="${mask(c.name)}" ${c.name===b.room?'selected':''}>${mask(c.name)} · ${mask(c.age)}</option>`).join('')}</select></div><div class="sc-formfield"><label>Hari</label><select name="day" id="sc-input-day">${DAYS.map((d,i)=>`<option value="${i}" ${i===b.day?'selected':''}>${d}, ${datelabel(i,b.week)}</option>`).join('')}</select></div></div><div class="sc-formgrid"><div class="sc-formfield"><label>Jenis booking</label><select name="type"><option value="trial" ${b.type==='trial'?'selected':''}>Trial / Tur</option><option value="dropin" ${b.type==='dropin'?'selected':''}>Extra Day / Drop-in</option><option value="regular" ${b.type==='regular'?'selected':''}>Jadwal tambahan</option></select></div><div class="sc-formfield"><label>Jam</label><select name="time">${['08.00–12.00','08.00–16.00','09.00–11.00','09.30–10.30','12.00–17.00'].map(t=>`<option ${t===b.time?'selected':''}>${t}</option>`).join('')}<option ${!['08.00–12.00','08.00–16.00','09.00–11.00','09.30–10.30','12.00–17.00'].includes(b.time)?'selected':''}>${mask(b.time)}</option></select></div></div><div class="sc-formhelp">Booking menambah kebutuhan kapasitas harian dan masuk riwayat kalender lokal. Tidak menagih pembayaran atau mengirim WhatsApp.</div><p class="sc-formerror" id="sc-form-error" aria-live="polite"></p></form>`,`${item?`<button class="sc-button" data-sc="cancelbooking" data-id="${mask(item.id)}" style="margin-right:auto;color:#ad5b50">Batalkan booking</button>`:''}<button class="sc-button primary" data-sc="submitbooking">${item?'Simpan perubahan':'Cek & simpan booking'}</button>`)}
function shiftModal(staffId='S8',day=sc.selDay){const s=STAFF.find(x=>x.id===staffId)||STAFF[7],existing=sc.shifts.find(x=>x.staff===staffId&&x.day===day&&x.week===sc.weekOffset);shellModal('Atur penugasan pengasuh','Setiap penugasan divalidasi agar satu pengasuh tidak bertugas di dua kelas pada waktu yang sama.',`<form id="sc-shift-form" class="sc-modal-body"><div class="sc-formgrid"><div class="sc-formfield"><label>Pengasuh</label><select name="staff">${STAFF.map(x=>`<option value="${mask(x.id)}" ${x.id===staffId?'selected':''}>${mask(x.name)} · ${mask(x.role)}</option>`).join('')}</select></div><div class="sc-formfield"><label>Hari</label><select name="day">${DAYS.map((d,i)=>`<option value="${i}" ${i===day?'selected':''}>${d}, ${datelabel(i)}</option>`).join('')}</select></div></div><div class="sc-formgrid"><div class="sc-formfield"><label>Penugasan</label><select name="room">${getClasses().map(c=>`<option value="${mask(c.name)}" ${c.name===(existing?.room||sc.selRoom)?'selected':''}>${mask(c.name)}</option>`).join('')}</select></div><div class="sc-formfield"><label>Shift</label><select name="time">${['07.00–15.00','08.00–16.00','09.00–17.00','10.00–18.00'].map(x=>`<option ${x===(existing?.time||s.hours)?'selected':''}>${x}</option>`).join('')}</select></div></div><p id="sc-form-error" class="sc-formerror" aria-live="polite"></p></form>`,`<button class="sc-button primary" data-sc="submitshift">Simpan penugasan</button>`)}
function validateSlot(room,day,week,excludedId=null){const c=cap(room);if(!c.total)return 'Kelas tidak tersedia';const forecast=bookDateCount(room,day,week,excludedId)+1;if(forecast>c.total)return `Kelas ${room} penuh pada ${DAYS[day]} (${forecast}/${c.total}). Pilih hari/kelas lain.`;const coverage=shiftAt(room,day,week).length,required=Math.ceil(forecast/(RATIOS[room]||6));if(coverage<required)return `Cakupan staf tidak cukup: ${coverage} bertugas, ${required} dibutuhkan. Atur shift terlebih dahulu.`;return null}
function saveBooking(){const form=document.getElementById('sc-booking-form');if(!form||!form.reportValidity())return;const data=new FormData(form),id=String(data.get('bookingId')||''),room=String(data.get('room')),day=Number(data.get('day')),old=sc.bookings.find(x=>x.id===id),child=String(data.get('child')).trim(),guardian=String(data.get('guardian')).trim();if(!child||!guardian){document.getElementById('sc-form-error').textContent='Isi nama anak dan wali.';return;}const issue=validateSlot(room,day,sc.weekOffset,old?.id||null);if(issue){document.getElementById('sc-form-error').textContent=issue;return;}const b={id:old?.id||'BK'+Date.now(),child,guardian,room,week:sc.weekOffset,day,type:String(data.get('type')),time:String(data.get('time')),name:(String(data.get('type'))==='trial'?'Trial ':String(data.get('type'))==='dropin'?'Extra day ':'Jadwal ')+child,status:'confirmed'};if(old)Object.assign(old,b);else{sc.bookings.push(b);if(!db.leads.some(l=>l.name===guardian&&l.child===child)){db.leads.push({id:'L'+Date.now(),name:guardian,child,age:cap(room).age,service:b.type==='trial'?'Trial Daycare':'Extra Day',status:b.type==='trial'?'Trial':'Penawaran',source:'Kalender Daylio',next:`Booking ${dateLong(day)} · ${b.time}`});save()}}
 sc.selRoom=room;sc.selDay=day;saveSC();closeModalSC();render();toast(old?'Jadwal diperbarui':'Booking tersimpan','Kalender dan prospek lokal diperbarui; pembayaran belum ditagih.');}
function saveShift(){const form=document.getElementById('sc-shift-form');if(!form)return;const data=new FormData(form),staff=String(data.get('staff')),day=Number(data.get('day')),room=String(data.get('room')),time=String(data.get('time'));const conflicts=staffShiftFor(staff,day,sc.weekOffset).filter(x=>x.room!==room);if(conflicts.length&&!window.confirm(`${STAFF.find(x=>x.id===staff).name} sebelumnya bertugas di ${conflicts.map(x=>x.room).join(', ')}. Pindahkan shift ke ${room}?`))return;sc.shifts=sc.shifts.filter(x=>!(x.staff===staff&&x.week===sc.weekOffset&&x.day===day));sc.shifts.push({id:'SH'+Date.now(),staff,room,time,week:sc.weekOffset,day});sc.selDay=day;sc.selRoom=room;saveSC();closeModalSC();render();toast('Shift tersimpan',STAFF.find(x=>x.id===staff).name+' · '+room+' · '+DAYS[day]);}
function actionSC(el){const op=el.dataset.sc;
 if(op==='prev'||op==='next'){sc.weekOffset+=op==='prev'?-1:1;saveSC();render();return}
 if(op==='now'){sc.weekOffset=0;saveSC();render();return}
 if(op==='view'){sc.view=el.dataset.view;saveSC();render();return}
 if(op==='filter'){sc.filter=el.dataset.room;saveSC();render();return}
 if(op==='select'||op==='selectday'){if(op==='select')sc.selRoom=el.dataset.room;sc.selDay=Number(el.dataset.day);saveSC();render();return}
 if(op==='newbooking'){if(appState.role==='caregiver')return;bookingModal();return}
 if(op==='editbooking'){if(appState.role==='caregiver')return;const b=sc.bookings.find(x=>x.id===el.dataset.id);if(b)bookingModal(b);return}
 if(op==='staffnew'){if(appState.role==='caregiver')return;shiftModal();return}
 if(op==='editshift'){if(appState.role==='caregiver')return;shiftModal(el.dataset.staff,Number(el.dataset.day));return}
 if(op==='submitbooking'){saveBooking();return}
 if(op==='submitshift'){saveShift();return}
 if(op==='cancelbooking'){const b=sc.bookings.find(x=>x.id===el.dataset.id);if(b&&window.confirm('Batalkan booking contoh untuk '+b.child+'?')){b.status='cancelled';saveSC();closeModalSC();render();toast('Booking dibatalkan','Tidak ada pembayaran yang diubah.')}return}
 if(op==='close'){closeModalSC();return}
 if(op==='backdrop'){if(el===window.event?.target)closeModalSC();return}
 if(op==='opencrm'){navigate('crm');return}
 if(op==='issue'){sc.selDay=Number(el.dataset.day);sc.selRoom=el.dataset.room;sc.view='staff';saveSC();render();toast('Review penugasan','Tap jadwal pengasuh atau gunakan Atur Shift untuk menambah coverage.');return}
 if(op==='reset'){if(confirm('Reset hanya data scheduler demo?')){sc=makeState();saveSC();render();toast('Kalender dikembalikan','Data utama Daylio tidak dihapus.')}return}
}
function moveBooking(id,room,day){const b=sc.bookings.find(x=>x.id===id);if(!b||appState.role==='caregiver')return;const error=validateSlot(room,day,sc.weekOffset,id);if(error){toast('Tidak dapat memindahkan booking',error);return;}b.room=room;b.day=day;b.week=sc.weekOffset;sc.selRoom=room;sc.selDay=day;saveSC();render();toast('Booking dipindahkan',`${b.child} → ${room}, ${dateLong(day)}`);}
// Visible navigation matches existing role-specific permissions; legacy manager schedules points to the new planner.
navs.owner.splice(3,0,['planner','Jadwal & Kapasitas','calendar']);
const oldManager=navs.manager.find(x=>x[0]==='schedules');if(oldManager){oldManager[0]='planner';oldManager[1]='Jadwal & Staf';}
navs.caregiver.splice(2,0,['planner','Jadwal Kelas','calendar']);
const ownerBaseV8=ownerPulseCore;
ownerPulseCore=function(){const orig=ownerBaseV8();const issues=weekIssues();if(!issues.length)return orig;const x=issues[0];return `<section class="sc-owner-alert"><div class="sc-owner-alert-icon">${schicon('calendar',18)}</div><div><b>${issues.length} jadwal staf perlu diperiksa minggu ini</b><p>${DAYS[x.day]} · ${x.room}: ${x.desc} Atur sebelum menerima booking baru.</p></div><button class="sc-button" data-page="planner">Buka jadwal ${schicon('arrow',14)}</button></section>`+orig};
const originalContentV8=renderContent;
renderContent=function(){if(appState.page==='planner'&&['owner','manager','caregiver'].includes(appState.role))return schedulerUI();return originalContentV8()};
// Prevent the old static schedule destination from staying active as dead functionality.
const originalNavigateV8=navigate;
navigate=function(page){return originalNavigateV8(page==='schedules'?'planner':page)};
function setDefaultEntry(){try{const u=new URL(location.href);if(u.searchParams.get('schedule')==='1'){appState.role='owner';appState.page='planner';}else if(u.searchParams.get('role')&&navs[u.searchParams.get('role')]){appState.role=u.searchParams.get('role');appState.page=navs[appState.role][0][0];}}catch(e){}}
// Delegated events; no in-place onclick handlers; no hidden direct external effects.
document.addEventListener('click',function(e){const el=e.target.closest('[data-sc]');if(!el)return;e.preventDefault();e.stopImmediatePropagation();if(el.dataset.sc==='backdrop'&&e.target!==el)return;actionSC(el)},true);
document.addEventListener('submit',function(e){if(e.target.id==='sc-booking-form'||e.target.id==='sc-shift-form'){e.preventDefault();e.stopImmediatePropagation();e.target.id==='sc-booking-form'?saveBooking():saveShift()}},true);

document.addEventListener('dragstart',function(e){const b=e.target.closest('.sc-event[data-booking-id]');if(!b)return;e.dataTransfer.setData('text/plain',b.dataset.bookingId);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',function(e){const cell=e.target.closest('.sc-cell[data-drop-room]');if(!cell)return;e.preventDefault();e.dataTransfer.dropEffect='move';cell.classList.add('drag-over')});
document.addEventListener('dragleave',function(e){const cell=e.target.closest('.sc-cell[data-drop-room]');if(cell&&!cell.contains(e.relatedTarget))cell.classList.remove('drag-over')});
document.addEventListener('drop',function(e){const cell=e.target.closest('.sc-cell[data-drop-room]');if(!cell)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');moveBooking(id,cell.dataset.dropRoom,Number(cell.dataset.dropDay));document.querySelectorAll('.sc-cell.drag-over').forEach(x=>x.classList.remove('drag-over'))});
if(window.innerWidth<=600&&sc.view==='week'&&!sc.mobilePrefSet){sc.view='day';sc.mobilePrefSet=true;saveSC();}
setDefaultEntry();render();
})();

<script>
/* Daylio v9 — SaaS tier + separate billing streams. Browser-only review. */
(function(){
'use strict';
const KEY='daylio-v9-subscription-preview';
const PRICES={essential:{name:'Essential',monthly:299000,max:25,headline:'Care & Trust',short:'Untuk daycare yang ingin merawat lebih baik dan mengabari orang tua.'},growth:{name:'Growth',monthly:699000,max:60,headline:'Run & Grow',short:'Untuk daycare yang ingin mengisi slot, mengatur staf dan menagih tanpa ribet.'},intelligence:{name:'Intelligence',monthly:1490000,max:120,headline:'Operate Smarter',short:'Untuk daycare dengan banyak aktivitas yang membutuhkan AI & insight.'}};
const TIERS=['essential','growth','intelligence'];
const FEATURES={crm:'growth',booking:'growth',finance:'growth',reports:'growth',leo:'intelligence'};
const PAGE_DESC={crm:['CRM & WhatsApp','Prospek baru, follow-up otomatis dan konversi ke pendaftaran'],booking:['Paket & Booking','Booking harian, trial, extra-day serta alokasi slot kelas'],finance:['Tagihan Orang Tua','Tagihan SPP berulang, bukti bayar, dan rekonsiliasi'],reports:['Laporan Bisnis','Funnel, okupansi, pendapatan, dan tren daycare'],leo:['LEO AI Workspace','AI yang mengusulkan tindakan lintas modul dengan persetujuan pengelola'],planner:['Schedule & Capacity Planner','Kelola kapasitas berbayar dan booking terjadwal']};
const safe=(val)=>String(val??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IDR=n=>'Rp'+Math.max(0,Number(n)||0).toLocaleString('id-ID');
const load=()=>{try{let o=JSON.parse(localStorage.getItem(KEY));return o&&o.v===9?o:null}catch(_){return null}};
const initial={v:9,active:'growth',preview:'growth',cycle:'monthly',addons:{cctv:0,analytics:0},subscriptionInvoices:[{id:'EL-2026-010',plan:'growth',cycle:'monthly',amount:699000,status:'Lunas · simulasi',date:'01 Okt 2026',method:'Transfer virtual account (contoh)'}],ledger:[],draft:null,modal:null};
let st={...initial,...(load()||{}),addons:{...initial.addons,...(load()?.addons||{})}};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){console.warn('localStorage simulation unavailable')}};
const effective=()=>st.preview||st.active;
const priceFor=(plan,cycle)=>PRICES[plan].monthly*(cycle==='yearly'?10:1);
const allowance=()=>PRICES[effective()].max;
const countUsed=()=>db.capacities.reduce((n,x)=>n+x.filled,0);
const enough=t=>TIERS.indexOf(effective())>=TIERS.indexOf(t);
const canView=(page,role=appState.role)=>{
 if(page==='subscription'&&role!=='owner')return false;
 if(page==='planner')return true;
 if(page==='integrations'||page==='parentcamera')return true;
 const need=FEATURES[page]; if(!need)return true;
 if(page==='leo'&&role==='parent')return enough('intelligence');
 return enough(need);
};
function overlayText(){return `<div class="v9-provider-band"><strong>Simulasi komersial:</strong> pembayaran langganan, invoice, add-on, dan upgrade pada halaman ini hanya perubahan data lokal browser. Tidak ada pembayaran atau layanan eksternal yang aktif.</div>`}
function compactValue(n){return IDR(n)}

 const cap=`<section class="v10-block"><div class="v10-blockhead"><div><h2>Kapasitas per kelas</h2><p>Slot yang tersedia dan siap ditindaklanjuti</p></div><button data-page="planner" class="v10-link">Buka jadwal →</button></div>${db.capacities.map(c=>`<div class="v10-caprow"><div><b>${esc(c.name)}</b><small>${esc(c.age)}</small></div><div class="v10-track"><span style="width:${c.filled/c.total*100}%"></span></div><em>${c.filled}/${c.total}</em></div>`).join('')}<div class="v10-insight"><span class="v10-insighticon">${ico('sparkles',17)}</span><div><b>Peluang tindak lanjut</b><p>${latest?esc(latest.name)+' mencari '+esc(latest.service)+' untuk '+esc(latest.child)+'. Cocokkan kebutuhan dengan kapasitas dan jadwal staf.':'Tidak ada prospek aktif saat ini.'}</p><button data-page="${enough('growth')?'crm':'subscription'}">${enough('growth')?'Tinjau prospek →':'Lihat fitur Growth →'}</button></div></div></section>`;
 const tasks=[{title:`${approvals.length} keputusan layanan tertunda`,body:'Review izin jemput dan laporan insiden sebelum ditutup.',page:'quality'},...(enough('growth')?[{title:`${overdue.length} tagihan perlu diperiksa`,body:'Cek transaksi dan bukti sebelum tandai lunas.',page:'finance'},{title:`${leads.length} calon keluarga dalam pipeline`,body:'Tindak lanjuti minat pendaftaran dan jadwal survei.',page:'crm'}]:[]),{title:'Jadwal kelas & staf',body:'Pastikan kapasitas dan pengasuh sesuai kebijakan.',page:'planner'}];
 const action=`<section class="v10-block"><div class="v10-blockhead"><div><h2>Butuh tindakan</h2><p>Prioritas untuk pemilik dan pengelola</p></div><button data-page="quality" class="v10-link">Lihat semua →</button></div>${tasks.map((t,i)=>`<button data-page="${t.page}" class="v10-workitem"><span class="v10-worknum">${String(i+1).padStart(2,'0')}</span><span class="v10-workcopy"><b>${t.title}</b><small>${t.body}</small></span>${ico('arrow',16)}</button>`).join('')}</section>`;
 const revenue=`<section class="v10-block"><div class="v10-blockhead"><div><h2>Status pembayaran</h2><p>Tagihan keluarga, bukan langganan SaaS</p></div><button data-page="${enough('growth')?'finance':'subscription'}" class="v10-link">${enough('growth')?'Lihat tagihan →':'Lihat paket →'}</button></div><div class="v10-minirow"><span>Sudah diterima</span><b>${money(paid)}</b></div><div class="v10-minirow"><span>Belum diterima</span><b>${money(outstanding)}</b></div><div class="v10-track" style="margin-top:14px;height:8px"><span style="width:${(paid+outstanding)?(paid/(paid+outstanding)*100):0}%;background:#478E7B"></span></div><p style="font-size:11px;color:#89989D;margin-top:12px">Berdasarkan invoice contoh yang tercatat, bukan saldo bank.</p></section>`;
 const statuses=['Baru','Survei','Trial','Penawaran'];let vals=statuses.map(s=>db.leads.filter(x=>x.status===s).length);let max=Math.max(1,...vals);
 const funnel=`<section class="v10-block"><div class="v10-blockhead"><div><h2>Perjalanan calon keluarga</h2><p>Dari inquiry sampai penawaran</p></div><button data-page="${enough('growth')?'crm':'subscription'}" class="v10-link">${enough('growth')?'Buka CRM →':'Aktifkan CRM →'}</button></div><div class="v10-funnel">${statuses.map((s,i)=>`<div class="v10-funnel-col"><b>${vals[i]}</b><span style="height:${15+vals[i]/max*52}px"></span><small>${s}</small></div>`).join('')}</div><p style="font-size:11px;color:#8899A0;margin-top:12px">Jumlah saat ini, bukan persentase konversi historis.</p></section>`;
 const footer=`<div class="v10-quickstrip"><div><b>Mulai dari pekerjaan yang nyata</b><p>Data anak → penugasan kelas → aktivitas → komunikasi keluarga</p></div><div class="v10-quickactions"><button data-page="family">Anak & keluarga →</button><button data-page="planner">Jadwal →</button><button data-page="integrations">CCTV & AI →</button></div></div>`;
 return section+stats+`<div class="v10-dashboardgrid">${cap}${action}</div>`+(enough('growth')?`<div class="v10-secondarygrid">${revenue}${funnel}</div>`:'')+footer;
}
renderContent=function(){if(appState.role==='owner'&&appState.page==='pulse')return v10OwnerHome();return v10OldContents();};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-v10]');if(!el)return;ev.preventDefault();ev.stopImmediatePropagation();if(el.dataset.v10==='branch'){v10BranchOpen=!v10BranchOpen;render();}if(el.dataset.v10==='branchmanage'){v10BranchOpen=false;if(appState.role==='owner')navigate('settings');else render();}},true);
const v10OldNavigate=navigate;
navigate=function(page){v10BranchOpen=false;return v10OldNavigate(page);};

render();
})();

</script>
</body>
</html>
