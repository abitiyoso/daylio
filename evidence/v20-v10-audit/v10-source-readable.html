/* DAYLIO — SUN OF CARE DESIGN SYSTEM | v4 corrected
   Source of truth: approved brand board, identical original logo asset.
   Brand: Sunrise Coral #FF704D, Golden Sun #FDBA3C,
          Peach Clay #F7A890, Warm Cream #FFF4EA, Charcoal Navy #0F2A44.
   Contrast: deeper interactive coral #AF4331 on white text; golden never used for body copy.
   Functional accents mint / lilac / blue are semantic, not brand colors. */
:root {
  --daylio-coral: #FF704D;
  --daylio-yellow: #FDBA3C;
  --daylio-peach: #F7A890;
  --daylio-cream: #FFF4EA;
  --daylio-navy: #0F2A44;
  --daylio-action: #AD4332;
  --daylio-action-hover: #983825;
  --daylio-mist: #FFF0E8;
  --daylio-linen: #FAF8F4;
  --daylio-teal: #27715B;
  --daylio-purple: #6D5A9A;
  --daylio-blue: #37698B;
  --ink: #162D42;
  --navy: var(--daylio-navy);
  --deep: var(--daylio-navy);
  --deep2: #11283D;
  --orange: var(--daylio-action);
  --coral: var(--daylio-coral);
  --sun: var(--daylio-yellow);
  --ivory: #FFFCF8;
  --paper: #FFFFFF;
  --page: #FAF8F5;
  --line: #EDE9E3;
  --muted: #657786;
  --sage: var(--daylio-teal);
  --sagebg: #E7F3ED;
  --red: #AA4843;
  --redbg: #FCEDEA;
  --blue: var(--daylio-blue);
  --bluebg: #EAF3FC;
  --amber: #89611F;
  --amberbg: #FFF2D9;
  --lilac: var(--daylio-purple);
  --lilacbg: #F0ECFA;
  --radius: 16px;
  --shadow: 0 7px 24px rgba(35,48,59,.035);
}
html { font-size: 16px; }
body { background:#EEEAE4; font-family: ui-sans-serif, "Plus Jakarta Sans", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); }
h1,h2,h3,h4 { color: var(--daylio-navy); letter-spacing:-.032em; }
button, select, input { accent-color: var(--daylio-action); }
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible {outline:3px solid #F4A491;outline-offset:3px}
/* Navigation: warm-light, brand-first, independently distinct from Kamelo's dark green shell. */
.shell {grid-template-columns: 252px minmax(0,1fr);background:var(--page);box-shadow: 0 14px 65px #182a3420;}
.sidebar {background:#FFFCF8;color:var(--daylio-navy);border-right:1px solid #EEE6DC;padding:25px 13px 19px;}
.side-brand {height:78px;background:transparent;border:0;border-radius:14px;padding:4px 4px 2px;margin:0 7px 9px;}
.side-brand img{width:214px;height:auto;max-height:72px;object-fit:contain;}
.side-org{font-size:12px;line-height:1.6;color:#516575;padding:3px 12px 19px;}
.side-org span{color:#8A949C!important}
.side-group-label{color:#937F75;font-size:10px;font-weight:780;letter-spacing:.12em;margin:11px 12px 10px;}
.nav-btn{color:#475767;min-height:43px;padding:11px 13px;gap:12px;font-size:13.1px;font-weight:670;border-radius:11px;margin:2px 0;transition:background .15s ease,color .15s ease;}
.nav-btn svg{color:#78828E;}
.nav-btn:hover{background:#FFF0E8;color:#9B432F;}
.nav-btn:hover svg{color:#B65D46;}
.nav-btn.active{background:#FFEDE4;color:#A53D2E;box-shadow:inset 0 0 0 1px #F8D8C9;font-weight:780;}
.nav-btn.active svg{color:#C45C45;}
.nav-btn.active::before{width:3px;top:10px;bottom:10px;left:0;background:var(--daylio-coral);}
.side-bottom{border-top:1px solid #EFE4DC;padding:14px 6px 2px;}
.branch-tile{background:#FFF7EF;border:1px solid #F3E2D1;border-radius:13px;color:var(--ink);}
.branch-tile img{border:2px solid white;}
.branch-tile b{font-size:12.7px;}
.branch-tile p{font-size:11px;color:#7D8A92;}
.sidelogo{display:flex;align-items:center;gap:9px;margin-top:16px;padding:0 8px;}
.sidelogo div{color:#9A9893!important;font-size:9px!important;letter-spacing:.07em;}
.sidelogo img{max-height:32px;width:93px;background:transparent;padding:0;border-radius:0;object-fit:contain;}
/* Header and typography */
.topbar{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:14px 30px;min-height:78px;}
.crumb .path{font-size:11.7px;color:#84929B;}
.crumb b{font-size:18px;font-weight:820;color:var(--daylio-navy);}
.search-wrap{background:#FBF9F7;border-color:#EAE6E0;padding:11px 13px;color:#8B939B;}
.search-wrap input{font-size:12.8px;}
.topbutton,.role-select{border-color:#E9E5DF;border-radius:11px;font-size:12.2px;}
.icon-btn{border-color:#E9E5DF;border-radius:11px;}
.icon-btn .dot{background:var(--daylio-coral);}
.avatar{background:#FFE8D7;color:#914D3B;}
.page{padding:27px 32px 77px;}
.page-head h1{font-size:29px;letter-spacing:-.035em;}
.page-head p{font-size:13.5px;color:#667783;}
.eyebrow{font-size:10.5px;letter-spacing:.12em;color:#B95340;}
.eyebrow.grey{color:#73818D;}
.small{font-size:13px;}
.tiny{font-size:11.5px;}
.muted{color:var(--muted);}
/* Surfaces */
.panel,.kpi{border:1px solid #EBE7E0;box-shadow:var(--shadow);}
.panel{border-radius:17px;}
.panel-pad{padding:22px;}
.panel-head{padding:20px 21px 14px;}
.panel-head h3{font-size:15px;font-weight:800;}
.panel-head p,.panel-sub{font-size:12.5px;line-height:1.55;color:#74838C;}
.kpis{gap:13px;margin-bottom:17px;}
.kpi{min-height:121px;padding:18px;border-radius:15px;background:linear-gradient(145deg,#fff,#FFFEFC);}
.kpi-label{font-size:12px;color:#6E7C87;}
.kpi-value{font-size:27px;letter-spacing:-.045em;color:#172D41;margin:12px 0 8px;}
.kpi-foot{font-size:11.7px;color:#7C8A92;}
.kpi-foot.good{color:var(--daylio-teal);}
.square-ico{border-radius:11px;width:37px;height:37px;flex-basis:37px;}
.square-ico.orange{background:#FFF0E7;color:#BD4F37;}
.square-ico.yellow{background:#FFF5D9;color:#99671E;}
.square-ico.green{background:#E8F4ED;color:#21715B;}
.square-ico.blue{background:#EBF2FC;color:#4676AD;}
.square-ico.red{background:#FCEAE9;color:#B35049;}
.square-ico.purple{background:#F0EBFA;color:#765DB0;}
/* Daylio's sun/smile is implicit in the open-space, golden vignette. Logo files untouched. */
.hero{height:208px;grid-template-columns:minmax(0,1fr) 32%;border:1px solid #F1E2D3;border-radius:18px;background:linear-gradient(112deg,#FFFAF4 0%,#FFF3E5 67%,#FFECD7 100%);margin-bottom:17px;position:relative;}
.hero:after{content:"";position:absolute;width:148px;height:148px;border-radius:50%;top:-86px;right:32%;background:radial-gradient(circle,#FFDE92AA,#FFF1C800 68%);pointer-events:none;}
.hero-body{padding:25px 26px;gap:10px;}
.hero-title{font-size:25px;line-height:1.19;max-width:600px;color:#172D41;}
.hero-desc{font-size:13.5px;line-height:1.62;color:#657581;max-width:540px;}
.hero-image img{object-position:center 43%;}
.hero-image:before{background:linear-gradient(90deg,#FFF1E5 0%,transparent 24%);}
/* Buttons: accessible dark coral primary; sunshine reserved for accents */
.btn{font-size:12.6px;font-weight:740;border-radius:10px;min-height:36px;}
.btn.small{font-size:11.9px;padding:8px 11px;}
.btn-lg{font-size:13.5px;min-height:43px;}
.btn.primary,.btn.accent{background:var(--daylio-action);border-color:var(--daylio-action);color:#FFF;}
.btn.primary:hover,.btn.accent:hover{background:var(--daylio-action-hover);border-color:var(--daylio-action-hover);}
.btn.ghost{background:#FFF8F2;border-color:#F4E7DC;}
.btn.link,.text-link,.emphasis{color:#A9422F;}
.text-link{font-size:12px;}
.pill{font-size:11.2px;padding:6px 10px;color:#63747D;background:#F9F6F3;border-color:#EFE8E1;}
.pill.green,.tag.active{background:#E6F4EC;color:#276A56;border-color:#D5ECDD;}
.pill.amber,.tag.pending{background:#FFF3D8;color:#8E621E;border-color:#F7E6B9;}
.pill.red,.tag.urgent{background:#FBE9E8;color:#AB433C;border-color:#F2CDCA;}
.pill.blue,.tag.info{background:#EAF3FC;color:#346B93;border-color:#DDE9F7;}
.pill.purple{background:#F0EBFA;color:#69599E;border-color:#E3DBF5;}
.tag{font-size:11.3px;}
/* Product patterns */
.action-row{padding:15px 20px;border-top-color:#F0ECE6;gap:13px;}
.action-row:hover{background:#FFFBF6;}
.action-copy h4,.taskitem h4{font-size:13px;color:var(--daylio-navy);}
.action-copy p,.taskitem p{font-size:12px;line-height:1.5;color:#7C8790;}
.progress{height:8px;background:#F7EFEA;}
.progress .fill,.meterbar>span,.bar{background:linear-gradient(90deg,#E79C72,#D56C50);}
.progress.orange .fill,.meterbar>span.warm,.bar.light{background:#F5BE68;}
.meterbar{background:#F5EDE6;}
.meter-title{font-size:13px;}
.meter-meta{font-size:11.5px;}
.bar-wrap .bar{border-radius:5px 5px 0 0;}
.chart-labels{font-size:11.2px;}
.kanban-col{background:#FCF8F4;border-color:#EFE7DE;}
.kanban-card{border-color:#EDE6DF;}
.kanban-card b{font-size:13px;}
.kanban-card p{font-size:11.8px;}
.kanban-title{font-size:12px;}
.quotation{background:#FFF9F2;border-left-color:#ED9A65;font-size:13px;}
.sidebar-note{background:#FFF7EF;border-color:#F4E5D8;}
.sidebar-note p{font-size:12px;color:#697987;}
.sidebar-note h4{font-size:13px;}
.stat-mini p{font-size:12px;}
.datebox.available{background:#F0F9F2;border-color:#D8EBD9;}
.datebox.busy{background:#FFF5E3;border-color:#F3DEBA;}
.datebox.selected{background:var(--daylio-navy);border-color:var(--daylio-navy);}
.datebox{font-size:11px;}
.chip{font-size:12px;border-color:#EDE5DC;background:#FFFDFC;}
.chip.active{background:var(--daylio-navy);border-color:var(--daylio-navy);color:#fff;}
.quick-tile{font-size:13px;padding:19px 10px;border-color:#EEE6DE;}
.quick-tile.active{background:#FFF0E7;border-color:#F3BFAF;box-shadow:0 0 0 2px #FFE4DA;color:#A64231;}
.kid-tile.selected{background:#FFF3E9;border-color:#F1BBA4;}
.kid-tile b{font-size:12.4px;}
.kid-tile p{font-size:11px;}
.big-summary{background:linear-gradient(115deg,#FFF9F3,#FFF0E2);border-color:#F2E2D3;}
.big-summary p{font-size:12px;}
.booking-box{background:#FFFAF4;border-color:#F3E6DA;}
.callout{background:#FFF9F3;border-color:#F1E6DC;color:#536879;font-size:12.3px;}
.callout b{color:var(--daylio-navy);}
.report-row h4{font-size:13px;}
.report-row p{font-size:12px;}
.table th{background:#FCF9F5;font-size:10.3px;padding:15px 16px;color:#657586;border-bottom-color:#EDE7E0;}
.table td{font-size:12.4px;padding:16px;border-bottom-color:#F0EBE6;}
.table tbody tr:hover td{background:#FFFAF5;}
.person b{font-size:12.7px;}
.person p{font-size:11.7px;}
.lead-letter{background:#FFF0E7;color:#A74633;}
.timeline-row strong{font-size:13px;}
.timeline-row p{font-size:12px;}
.timeline-row .time{font-size:11px;}
.timeline-row:after{background:#F0E6DC;}
.field label{font-size:12.5px;color:#43566A;}
.field input,.field select,.field textarea{font-size:13.5px;border-color:#E8E4DE;border-radius:10px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#D78F7C;box-shadow:0 0 0 3px #FDE8E1;}
.modal-backdrop{background:#142536a8;}
.modal{border:1px solid #F3E4D8;}
.close{background:#FFF3EC;}
.toast{background:var(--daylio-navy);}
.toast .desc{color:#D8E3E8;}
.feature-flag{background:#FFF9F1;border-color:#F3DBBE;}
.loading-mock{background:#FFF1E7;color:#A44B3C;}
.shift{background:#FFF0E6;color:#A1513B;}
/* Parent warmth without drowning the platform in pink/orange */
.photo-strip img,.media-tile img{object-position:center 40%;}
/* Tablet/mobile rhythm */
@media(max-width:1250px){.page{padding:23px 22px 65px;}.shell{grid-template-columns:235px minmax(0,1fr);}.hero-title{font-size:23px;}}

  .panel-head{padding:16px;}
  .table th{font-size:10px;}
  .table td{font-size:11.8px;}
}
/* Mobile hero must grow with its content; avoid clipped CTAs and descriptions. */
@media(max-width:620px){
  .hero{height:auto;min-height:0;grid-template-columns:1fr;}

}

/* Daylio UX V5 — Sun of Care. Same logo bytes, compact brand lockup. */
:root{--daylio-coral:#FF704D;--daylio-yellow:#FDBA3C;--daylio-navy:#0F2A44;--daylio-action:#AD4332;--daylio-cream:#FFF4EA;--line:#EDE9E3}

.branch-tile{padding:9px;gap:9px}
.branch-tile img{width:38px!important;height:39px!important;object-fit:cover}
.sidelogo{padding:9px 6px 0!important;display:flex!important;align-items:center!important;gap:7px!important}
.sidelogo div{font-size:9px!important;white-space:nowrap}
.sidelogo img{width:72px!important;max-width:72px!important;max-height:22px!important;padding:2px 4px!important}
.kpi-value{letter-spacing:-.04em}
.table-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.table-actions .btn{white-space:nowrap}

.btn.ghost:hover{background:#FFF4EA}
.btn.photo-action{background:#FFF4EA;color:#9E432F;border-color:#F1D8CB}

.field input[type=file]{font-size:12px;width:100%;border:1px dashed #DDC6B4;background:#FFFBF8;padding:12px;border-radius:10px;color:#536274}
.photo-editor{display:grid;grid-template-columns:142px minmax(0,1fr);gap:17px;align-items:start}
.photo-upload-preview{min-height:145px;border:1px dashed #E7D4C5;background:#FFF9F2;border-radius:15px;display:flex;flex-direction:column;gap:9px;align-items:center;justify-content:center;color:#9B7360;text-align:center;font-size:11px;overflow:hidden}
.photo-upload-preview img{width:100%;height:145px;object-fit:cover;border-radius:13px}
.journey-path{display:flex;align-items:center;justify-content:space-between;gap:8px;overflow-x:auto;background:white;border:1px solid var(--line);border-radius:14px;padding:14px 19px;margin-bottom:16px;white-space:nowrap}
.journey-path>div{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#536471}
.journey-path b{font-weight:750}
.journey-path>div span{background:#FFF1E8;color:#A74430;padding:6px 7px;border-radius:7px;font-size:10px;font-weight:790}
.journey-path>svg{color:#BEC4C6;flex:0 0 auto;width:14px}
.subtabs{display:flex;align-items:center;gap:6px;margin:0 0 17px;padding:5px;background:#F3F0EC;border:1px solid #ECE7E2;border-radius:13px;overflow-x:auto}
.subtab{border:0;border-radius:9px;background:transparent;color:#61717D;padding:11px 15px;font-weight:730;font-size:12px;white-space:nowrap;cursor:pointer}
.subtab:hover{color:#A84932;background:#FFF8F1}
.subtab.active{background:#fff;box-shadow:0 2px 8px #182e3610;color:#A3432F}
.family-media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;padding:0 18px 18px}
.family-media-card{border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;gap:11px;align-items:center;min-width:0}
.family-media-card>img{width:70px;height:78px;object-fit:cover;border-radius:9px;background:#FFF4EA}
.family-media-card>b,.family-media-card div{min-width:0}
.family-media-card b{font-size:12px}
.family-media-card p{font-size:11px;color:#71808A;margin:4px 0 9px}
.panel-footnote{display:flex;align-items:center;gap:8px;margin:8px 18px 18px;padding:12px;background:#FFF9F3;color:#8A6756;font-size:11.5px;border-radius:9px;line-height:1.5}
.onboard-row{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.onboard-row:last-child{border-bottom:none}
.onboard-row .flex1{min-width:0}
.onboard-row b{font-size:12px}
.onboard-row p{font-size:11px;color:#81909C;margin-top:4px}
.onboard-index{background:#F2EDE8;color:#8B817A;display:flex;align-items:center;justify-content:center;width:29px;height:29px;border-radius:50%;font-size:11px;font-weight:800;flex:0 0 auto}
.onboard-index.done{background:#E5F3EB;color:#2F7155}
.onboard-progress{height:7px;border-radius:20px;background:#F0EBE8;overflow:hidden}
.onboard-progress>div{height:100%;background:#D8745B;border-radius:20px;transition:width .2s}
.camera-explainer{display:flex;align-items:center;gap:13px;padding:15px 17px;background:#FFF9F2;border:1px solid #F4E4D7;border-radius:14px;margin:2px 0 16px}
.camera-explainer>div:nth-child(2){flex:1}
.camera-explainer b{font-size:13px}
.camera-explainer p{color:#6C7B86;font-size:11.6px;line-height:1.5;margin-top:3px}
.camera-explainer .btn{white-space:nowrap}
.camera-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px 16px}
.camera-grid.three{grid-template-columns:repeat(3,minmax(0,1fr));padding:0}
.camera-card{border:1px solid #E9E5E1;border-radius:13px;background:white;overflow:hidden;min-width:0}
.camera-preview{height:126px;position:relative;background:#E8E2D9;overflow:hidden}
.camera-preview img{width:100%;height:100%;object-fit:cover;filter:saturate(.74) brightness(.86)}
.camera-preview:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#061f328c 0%,transparent 64%);pointer-events:none}
.camera-preview.compact{height:180px;border-radius:11px}
.camera-preview.large{height:300px;margin:0 16px 0;border-radius:12px}
.camera-watermark{position:absolute;left:10px;bottom:9px;right:8px;z-index:1;font-size:9.5px;font-weight:800;color:white;letter-spacing:.08em;line-height:1.5;text-shadow:0 1px 3px #0008}
.camera-card-body{padding:12px 13px 14px;display:grid;gap:9px}
.camera-card-body b{font-size:12px}
.camera-card-body p{font-size:11px;line-height:1.55;color:#6D7B83}
.camera-card-body .btn{justify-self:start}
.access-list{padding:0 18px 16px}
.access-item{padding:12px 0;border-bottom:1px solid #F1ECE7;gap:14px}
.access-item:last-child{border-bottom:none}
.access-item b{font-size:12px}
.access-item p{font-size:11px;color:#76848B;margin-top:4px;line-height:1.6}
.journey-mini{padding:0 18px 15px}
.journey-mini>div{padding:12px 0;border-bottom:1px solid #F0ECE8}
.journey-mini>div:last-child{border:0}
.journey-mini b{font-size:12px}
.journey-mini p{font-size:11px;color:#72818A;margin-top:5px;line-height:1.6}
.journey-service-card{background:#FFFDFB}
.journey-service-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:17px}
.journey-service-grid>div{border:1px solid #F2E9DF;background:#FFFAF5;border-radius:10px;padding:11px}
.journey-service-grid b{font-size:12px}
.journey-service-grid p{font-size:11px;color:#74808B;line-height:1.5;margin-top:4px}
@media(max-width:1250px){.shell{grid-template-columns:224px minmax(0,1fr)}.family-media-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:940px){.sidebar{width:250px;height:100dvh;overflow-y:auto}.journey-service-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.camera-grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.photo-editor{grid-template-columns:1fr}.photo-upload-preview{min-height:100px}.photo-upload-preview img{height:150px}.camera-explainer{align-items:flex-start;flex-wrap:wrap}.camera-explainer .btn{margin-left:45px}.camera-grid,.camera-grid.three{grid-template-columns:1fr}.journey-path{padding:12px;gap:10px}.journey-path>div{font-size:10.5px}.family-media-grid{grid-template-columns:1fr}.journey-service-grid{grid-template-columns:1fr}.subtabs{margin-bottom:13px}.subtab{font-size:11px;padding:10px 11px}.camera-preview.large{height:215px}.side-brand{margin-top:4px;height:55px}.side-brand img{width:142px!important;max-width:142px!important}.table-actions{min-width:165px}.modal .field{min-width:0}}
/* Final compact endorsement and parent development */
.side-brand img{width:127px!important;max-width:127px!important;max-height:43px!important}
.profile-growth{display:flex;gap:16px;padding:4px 18px 18px;align-items:center}
.profile-growth img{width:91px;height:95px;border-radius:12px;object-fit:cover}
.profile-growth h3{font-size:19px}
.profile-growth p{font-size:12px;color:#71808A;line-height:1.55;margin-top:5px}
@media(max-width:620px){.side-brand img{width:127px!important;max-width:127px!important}.profile-growth{gap:12px}.profile-growth img{width:76px;height:84px}}

/* Daylio V6: calm productivity / editorial data visualization */
:root {--v6-ink:#1D3042; --v6-soft:#73818F; --v6-line:#E9E8E3; --v6-cream:#FAF8F4; --v6-coral:#CA634F; --v6-coral-d:#AA4E3F; --v6-sun:#EAB85D; --v6-navy:#17324A; --v6-shadow:0 4px 18px rgba(27,40,48,.032); --page:#F7F7F4; --line:#E9E8E3; --daylio-action:#AD4E3E; --orange:#AD4E3E; --ink:#213449; --muted:#687989; }
html {font-size:15px} body {font-family:"DM Sans",Inter,system-ui,sans-serif;color:var(--v6-ink);background:#F3F3F1;line-height:1.5;letter-spacing:-.008em}
h1,h2,h3,h4,.crumb b,.v6-stat-num {font-family:Manrope,"Inter Display",Inter,system-ui,sans-serif;}
.shell {grid-template-columns:222px minmax(0,1fr);max-width:1780px;background:var(--page);}
.sidebar {background:#FFFDF9;border-right:1px solid #ECE7E0;padding:20px 11px 16px}
.side-brand {height:53px;min-height:53px;background:none!important;margin:0 8px 9px;padding:0;justify-content:flex-start}
.side-brand img {width:118px!important;max-width:118px!important;height:auto!important;max-height:41px!important;object-position:left center}
.side-org {padding:0 11px 14px;font-size:11.4px;line-height:1.6;color:#667585}
.side-org span {color:#84909C!important}
.side-group-label {font-size:10px;margin:12px 11px 10px;letter-spacing:.11em;color:#9F948F}
.nav-btn {color:#566473;min-height:42px;font-size:12.4px;font-weight:650;border-radius:9px;padding:9px 10px;gap:11px;margin:2px 0}
.nav-btn svg {color:#8A97A1}
.nav-btn:hover {background:#F7F1EB;color:#7C4D43}
.nav-btn.active {background:#FDECE3;color:#A44C3A;box-shadow:none;font-weight:750}
.nav-btn.active::before {background:var(--v6-coral);top:9px;bottom:9px}
.nav-btn.active svg {color:#B55A45}
.side-bottom {border-color:#F1E8E2}
.branch-tile {background:#FBF7F1;border-color:#F0E7DD}
.branch-tile b {color:#243748}
.topbar {min-height:78px;padding:13px 32px;border-bottom-color:#ECEAE6;background:#fff;gap:13px}
.crumb .path {font-size:11.5px}
.crumb b {font-size:17px;font-weight:800;letter-spacing:-.04em}
.search-wrap {background:#FAFAF8;border-color:#EEECE7;width:min(280px,23vw)}
.search-wrap input {font-size:12.8px}
.role-select,.topbutton {font-size:12px}
.page {padding:31px 34px 72px;max-width:1540px;margin:auto}
.btn {min-height:39px;font-family:"DM Sans",Inter,sans-serif;font-size:12.5px;border-radius:10px;font-weight:700;letter-spacing:0}
.btn.primary,.btn.accent {background:var(--daylio-action);border-color:var(--daylio-action)}
.btn.primary:hover,.btn.accent:hover {background:#963F32;border-color:#963F32}
.btn.small {min-height:35px;font-size:12px}
.page-head h1 {font-size:29px}
.page-head p {font-size:13.3px;line-height:1.6}
.panel-head h3 {font-size:15px}
.panel-head p {font-size:12.2px}
.panel,.kpi {box-shadow:var(--v6-shadow);border-color:var(--v6-line)}
.panel {border-radius:15px}
.kpi {border-radius:13px}
/* v6 business overview */
.v6-intro {display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:26px}
.v6-overline {display:flex;align-items:center;gap:9px;font:800 10px/1.2 "DM Sans",Inter,sans-serif;letter-spacing:.12em;color:#9C7C6D}
.v6-overline i {display:block;width:4px;height:4px;border-radius:50%;background:#CE8B6C}
.v6-intro h1,.v6-parent-greeting h1 {font-size:clamp(26px,2.6vw,35px);letter-spacing:-.055em;line-height:1.2;margin-top:9px;font-weight:800;color:#1B3042}
.v6-intro h1 span {font-size:24px;color:#E8B25B;display:inline-block;transform:translateY(-2px)}
.v6-intro p {font-size:13.9px;color:#6F7F88;line-height:1.55;margin-top:9px}
.v6-intro-actions {display:flex;align-items:center;gap:11px;flex:0 0 auto}
.v6-today {display:flex;align-items:center;gap:8px;font-size:12.5px;color:#6A7985;font-weight:600;border:1px solid #EDEAE5;background:#fff;padding:11px 13px;border-radius:10px}
.v6-stat-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:0 0 16px}
.v6-stat {min-width:0;min-height:165px;border:1px solid #E9E9E5;background:white;border-radius:14px;position:relative;padding:19px 19px 16px;box-shadow:var(--v6-shadow)}
.v6-stat.coral {border-top:3px solid #D47B62}
.v6-stat.navy {border-top:3px solid #334F66}
.v6-stat.gold {border-top:3px solid #E4B256}
.v6-stat.neutral {border-top:3px solid #B4B8B8}
.v6-stat-label {display:flex;align-items:center;justify-content:space-between;font-size:12.6px;font-weight:700;color:#6A7985;gap:6px}
.v6-stat-icon {display:grid;place-items:center;color:#B0A39D}
.v6-stat.coral .v6-stat-icon{color:#BD6F59}.v6-stat.navy .v6-stat-icon{color:#526F85}.v6-stat.gold .v6-stat-icon{color:#BA8A3B}
.v6-stat-num {font-size:clamp(22px,2.1vw,29px);font-weight:800;letter-spacing:-.056em;margin:13px 0 4px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v6-stat-detail {font-size:11.9px;line-height:1.5;color:#89939A}
.v6-stat-link {margin-top:11px;border:0;background:transparent;color:#A15341;display:flex;gap:5px;align-items:center;padding:0;font-size:11.6px;font-weight:800}
.v6-dash-charts {display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px;margin-bottom:16px}
.v6-surface {min-width:0;background:white;border:1px solid #E8E9E6;border-radius:16px;box-shadow:var(--v6-shadow);overflow:hidden}
.v6-surface-head {display:flex;align-items:center;justify-content:space-between;gap:15px;padding:23px 23px 14px}
.v6-surface-head h2 {font-size:17px;font-weight:800;letter-spacing:-.035em;line-height:1.35;color:#23394B;margin:6px 0 0}
.v6-surface-head p {font-size:12.3px;color:#84919B;line-height:1.6;margin-top:4px}
.v6-surface-kicker {font-size:10px;font-weight:800;letter-spacing:.13em;color:#B58F76}
.v6-text-action {flex:0 0 auto;border:none;background:transparent;display:flex;align-items:center;gap:6px;color:#B45C48;font-size:12px;font-weight:750;padding:7px 0;white-space:nowrap}
.v6-cap-chart {padding:9px 23px 13px;display:flex;flex-direction:column;gap:24px}
.v6-cap-row {display:grid;grid-template-columns:110px minmax(0,1fr) 60px;gap:17px;align-items:center}
.v6-cap-label {display:flex;flex-direction:column;gap:3px}
.v6-cap-label strong {font-size:12.4px;color:#314556}
.v6-cap-label span {font-size:11.2px;color:#9BA2A6}
.v6-cap-meters {display:flex;flex-direction:column;gap:7px}
.v6-cap-meters>span {font-size:11.4px;color:#7E8B91}
.v6-cap-bar {height:10px;border-radius:20px;background:#F1EEE8;overflow:hidden}
.v6-cap-bar>div {height:100%;border-radius:20px;background:linear-gradient(90deg,#EAA77A 0%,#D2755E 100%);transition:width .2s ease}
.v6-cap-free {font-size:11.4px;color:#B06A4F;justify-self:end;white-space:nowrap;font-weight:750}
.v6-under-chart {display:flex;align-items:center;gap:8px;margin:8px 23px 20px;border-top:1px solid #F0EFEB;padding-top:14px;font-size:11.8px;flex-wrap:wrap}
.v6-under-chart strong {color:#3C5261;font-weight:800}
.v6-under-chart>span:last-child {color:#82929C}
.v6-dot {width:9px;height:9px;border-radius:50%;display:inline-block}.v6-dot.coral{background:#D57E68}
.v6-revenue-plot {padding:1px 23px 21px}
.v6-rev-total {display:flex;align-items:end;justify-content:space-between;gap:12px;margin:8px 0 18px}
.v6-rev-total>div:first-child {display:flex;flex-direction:column;gap:6px}
.v6-rev-total span {font-size:12px;color:#84909A}
.v6-rev-total strong {font:800 26px/1.2 Manrope,"Inter Display",Inter,sans-serif;color:#1B3244;letter-spacing:-.055em}
.v6-rev-note {font-size:11.2px;color:#A0A6AA;text-align:right}
.v6-rev-stacked {height:16px;border-radius:100px;background:#F2EFEC;display:flex;overflow:hidden;gap:2px;margin-bottom:20px}
.v6-rev-stacked .paid{background:#658F7D}.v6-rev-stacked .due{background:#D57960}.v6-rev-stacked .pending{background:#E5BD68}
.v6-rev-legend {display:grid;grid-template-columns:8px minmax(0,1fr) auto;align-items:center;gap:9px;font-size:12.3px;color:#647686;padding:8px 0}
.v6-rev-legend i {width:8px;height:8px;border-radius:50%}.v6-rev-legend i.paid{background:#658F7D}.v6-rev-legend i.due{background:#D57960}.v6-rev-legend i.pending{background:#E5BD68}
.v6-rev-legend b {font-size:12.1px;color:#2E4657;font-weight:750}
.v6-dash-lower {display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.6fr);gap:16px;margin-bottom:15px}
.v6-insight-list {padding:0 23px 17px}
.v6-insight-list article {display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid #F1F0ED;min-height:78px}
.v6-insight-number {font:800 11px/1 Manrope,Inter,sans-serif;color:#BF9483;background:#FAF4EE;flex:0 0 34px;height:34px;border-radius:11px;display:grid;place-items:center}
.v6-insight-list article>div:nth-child(2) {flex:1;min-width:0}
.v6-insight-list b {font-size:12.9px;color:#314555;font-weight:750}
.v6-insight-list p {font-size:11.7px;color:#89949C;margin-top:5px;line-height:1.55}
.v6-insight-list button {flex:0 0 auto;border:0;background:transparent;display:flex;gap:5px;align-items:center;color:#A95D47;font-weight:750;font-size:11.5px;padding:6px 0}
.v6-funnel {display:grid;gap:12px;padding:6px 23px 14px}
.v6-funnel-item {display:grid;grid-template-columns:77px 1fr 18px;align-items:center;gap:10px;font-size:11.9px;color:#778590}
.v6-funnel-track {background:#F0EDE9;height:7px;border-radius:12px;overflow:hidden}
.v6-funnel-track i {height:100%;display:block;background:#D7A88E;border-radius:10px}
.v6-funnel-item b {font-size:12px;color:#354A59;font-weight:800;text-align:right}
.v6-funnel-foot {border-top:1px solid #F1F0EB;margin:8px 23px 17px;padding-top:12px;font-size:11.8px;color:#86939A;display:flex;justify-content:space-between;align-items:center;gap:5px}
.v6-funnel-foot button{border:0;background:transparent;font-size:11.6px;color:#A95D47;display:flex;gap:4px;align-items:center;font-weight:750}
.v6-shortcuts {display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 0}
.v6-shortcuts>span {font-size:10px;letter-spacing:.11em;font-weight:800;color:#A9A09A;margin-right:9px}
.v6-shortcuts button {display:flex;align-items:center;gap:8px;border:1px solid #E9E8E3;background:#fff;padding:10px 12px;border-radius:10px;color:#556878;font-weight:700;font-size:11.7px;box-shadow:var(--v6-shadow)}
.v6-shortcuts button>svg:first-child {color:#B66C57}
.v6-operator-intro {margin-bottom:25px}
.v6-manager-actions {padding:0 23px 14px}
.v6-action-line {display:flex;gap:12px;align-items:center;padding:16px 0;border-top:1px solid #F0EFEB}
.v6-action-icon {flex:0 0 40px;height:40px;border-radius:11px;background:#FBF0E2;display:grid;place-items:center;color:#B17C51}
.v6-action-icon.red {background:#FBEAE7;color:#C15B50}
.v6-action-info {min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
.v6-action-info strong {font-size:12.9px;color:#263D4F}
.v6-action-info span {font-size:11.8px;color:#83909A;line-height:1.5}
.v6-coverage-note {margin:7px 23px 22px;padding:12px;border-radius:11px;background:#F7F7F4;display:flex;gap:9px;align-items:center;color:#71818B;font-size:11.8px}
.v6-empty {color:#84939A;padding:17px 0;font-size:12.4px}
/* caregiver */
.v6-care-strip {display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #E9E8E4;background:white;border-radius:15px;margin:0 0 15px;padding:20px 8px}
.v6-care-strip>div{display:flex;flex-direction:column;align-items:center;gap:5px;border-right:1px solid #F0EEEA}
.v6-care-strip>div:last-child {border-right:none}
.v6-care-strip strong {font:800 29px/1.25 Manrope,Inter,sans-serif;color:#263B4C;letter-spacing:-.05em}
.v6-care-strip span {font-size:11.6px;color:#86929A}
.v6-quick-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:7px 23px 23px}
.v6-quick-grid button {border:1px solid #EFE9E2;border-radius:14px;min-height:116px;background:#FEFDFC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#3C5060;font-size:13px}
.v6-quick-grid button:hover {border-color:#E3B49E;background:#FFF7F0}
.v6-quick-grid button span {width:43px;height:43px;background:#FFF1E8;display:grid;place-items:center;color:#D17A59;border-radius:13px}
.v6-quick-grid button strong {font-size:12.6px;font-weight:750}
.v6-care-needs {padding:0 23px 19px}
.v6-care-needs>div {display:flex;align-items:center;gap:12px;border-top:1px solid #F1EEE9;padding:14px 0}

ne aktivitas terbit','Yang ditampilkan hanya milik Alya.',null,`<div class="timeline">${events.map(x=>`<div class="timeline-row">${miniIcon(x.type==='Makan'?'utensil':x.type==='Tidur'?'moon':'sun',x.type==='Makan'?'yellow':x.type==='Tidur'?'purple':'orange')}<div class="flex1"><strong>${x.type} · ${x.result}</strong><p>${esc(x.note)}</p></div><div class="time">${x.time}</div></div>`).join('')||'<div class="empty">Belum ada aktivitas diterbitkan.</div>'}</div>`)}</div><div class="colstack">${panel('Pesan dari rumah','Akan terlihat oleh pengasuh kelas.',null,`<div style="padding:0 18px 17px"><div class="callout">${esc(db.handovers.filter(h=>h.child===c.id).slice(-1)[0]?.message||'Belum ada catatan dari rumah hari ini.')}</div>${btn(ico('plus',14)+' Kirim pesan pagi','morningNote','btn full','style="margin-top:10px"')}</div>`)}${panel('Penjemputan Alya','Hanya wali/penjemput yang berwenang.',null,`<div style="padding:0 18px 17px">${p.map(x=>`<div class="between" style="padding:10px 0;border-top:1px solid var(--line)"><div class="gap10">${miniIcon('user','green')}<div><div class="small semi">${x.person}</div><div class="tiny muted">${x.relation} · rutin</div></div></div>${pill('Aktif','green')}</div>`).join('')}<div style="margin-top:8px">${btn('Atur izin penjemput','nav-parentpickup','btn full')}</div></div>`)}${panel('Tumbuh bersama','Portofolio & observasi perkembangan anak.',null,`<div style="padding:0 18px 17px"><div class="gap10">${miniIcon('star','yellow')}<p class="small" style="line-height:1.55">${db.observations.filter(o=>o.child===c.id&&o.reviewed).length} observasi sudah ditinjau pendidik.</p></div>${btn('Lihat Growth Journey','nav-development','btn full','style="margin-top:12px"')}</div>`)}</div></div>`}
function parentStory(){const c=childBy('C1'),events=db.activities.filter(x=>x.child===c.id&&x.published).slice().reverse();return `${pageHeader('Daily Story Alya','Aktivitas personal yang dibagikan setelah ditinjau sesuai kebijakan daycare.',btn(ico('download',14)+' Ekspor timeline','exportStory','btn'))}<div class="cols-main">${panel('Kegiatan & momen hari ini','Jumat, 16 Oktober 2026',null,`<div class="timeline">${events.map(x=>`<div class="timeline-row">${miniIcon(x.type==='Makan'?'utensil':x.type==='Tidur'?'moon':'sun','orange')}<div class="flex1"><strong>${x.type} · ${x.result}</strong><p>${esc(x.note)}</p></div><div class="time">${x.time}</div></div>`).join('')}</div><div class="photo-strip"><img src="${photo('child-art.webp')}" alt="Kegiatan seni"><img src="${photo('child-meal.webp')}" alt="Makan"><img src="${photo('child-activity.webp')}" alt="Bermain"></div>`)}<div class="colstack">${panel('Ringkasan harian Alya','Dari catatan aktual caregiver.',null,`<div style="padding:0 18px 18px"><div class="quotation">Alya mengikuti kegiatan kelas dengan baik. Ia bermain dan menggambar bersama teman, makan sebagian porsinya, kemudian beristirahat. Ini rangkuman dari catatan yang telah dibagikan daycare.</div>${btn('Tanyakan ke LEO','nav-leo','btn full','style="margin-top:12px"')}</div>`)}${panel('Privasi foto',null,null,`<div class="callout" style="margin:0 18px 18px">Hanya foto berizin yang dapat dibagikan kepada wali terkait. Foto kelompok memerlukan pemeriksaan akses dan consent anak lain sebelum ditampilkan.</div>`)}</div></div>`}
function parentBooking(){const c=childBy('C1');return `${pageHeader('Paket & Jadwal Anak','Lihat paket aktif Alya, jadwal penitipan, dan permintaan hari tambahan.',btn(ico('plus',15)+' Request extra day','extraDay','btn primary'))}<div class="cols-main">${panel('Paket aktif','Little Steps Daycare · Oktober 2026',null,`<div style="padding:0 18px 18px"><div class="big-summary"><div class="square-ico green" style="width:58px;height:58px">${ico('calendar',24)}</div><div><h3>Full Day</h3><p>Senin–Jumat · 08.00–18.00<br>Masa paket sampai 31 Okt 2026</p></div></div><div class="between" style="padding:17px 3px"><span class="small semi">Biaya paket Oktober</span><b>${money(2800000)}</b></div><div class="between"><span class="small semi">Status pembayaran</span>${pill('Lunas','green')}</div></div>`)}<div class="colstack">${panel('Extra day / drop-in','Permintaan dicek terhadap kapasitas kelas.',null,`<div style="padding:0 18px 18px"><div class="callout">Tambahan hari bukan konfirmasi otomatis. Daycare akan memeriksa slot, kelompok usia, dan kesiapan pengasuh sebelum menerima.</div>${btn('Ajukan hari tambahan','extraDay','btn full primary','style="margin-top:12px"')}</div>`)}${panel('Tagihan keluarga','Hanya yang terkait dengan Alya.',null,db.invoices.filter(i=>i.child===c.id).map(i=>actionRow('receipt',i.title,`${money(i.amount)} · ${i.status}`,`invoice-${i.id}`,'Detail','green')).join(''))}</div></div>`}
function parentPickup(){let p=db.pickups.filter(x=>x.child==='C1'),logs=db.pickupLogs.filter(x=>x.child==='C1');return `${pageHeader('Izin Penjemputan Alya','Penjemput rutin tersimpan; izin pengganti hanya berlaku sesuai tanggal yang ditentukan.',btn(ico('plus',15)+' Izin Penjemput Baru','newPickup','btn primary'))}<div class="cols-main">${panel('Penjemput berizin',`${p.length} penjemput tercatat untuk Alya`,null,`<div style="padding:0 18px 16px">${p.map(x=>`<div class="action-row" style="padding-left:0;padding-right:0">${miniIcon('user','green')}<div class="action-copy"><h4>${x.person} · ${x.relation}</h4><p>${x.type==='rutin'?'Penjemput rutin':'Pengganti sementara'} · sampai ${x.until}</p></div>${pill(x.status==='valid'?'Aktif':x.status==='pending'?'Menunggu review':'Tidak aktif',x.status==='valid'?'green':'amber')}${x.type!=='rutin'&&x.status==='valid'?btn('Cabut izin',`revoke-${x.id}`,'btn small'):''}</div>`).join('')}</div>`)}<div class="colstack">${panel('Riwayat serah-terima','Bukti pemeriksaan dan catatan petugas.',null,logs.map(l=>actionRow('shield',`${l.person} · ${l.time}`,`Petugas ${l.staff} · ${l.method}`,`audit-${l.id}`,'Lihat','green')).join(''))}${panel('Aturan keamanan','Verifikasi oleh petugas daycare tetap wajib.',null,`<div class="callout" style="margin:0 18px 18px">Untuk penjemput pengganti, wali memberikan izin, pengelola memeriksa, lalu staf memverifikasi identitas sebelum anak diserahkan. CCTV bukan pengganti pemeriksaan identitas.</div>`)}</div></div>`}
function leo(){let owner=appState.role==='owner',parent=appState.role==='parent';let suggestions=parent?['Alya makan apa hari ini?','Berapa lama Alya tidur?','Siapa yang boleh menjemput Alya?']:owner?['Apa prioritas bisnis daycare hari ini?','Slot kelas mana masih kosong?','Siapa prospek yang harus di-follow-up?']:['Aktivitas apa yang belum diterbitkan?','Apa instruksi khusus kelas Toddler?','Izin penjemput apa yang perlu ditinjau?'];return `${pageHeader('LEO Copilot','Asisten berbasis data contoh Daylio yang tersedia sesuai role, bukan penyedia LLM live.',pill('Sumber data dapat ditelusuri','blue'))}<div class="cols-main"><div class="colstack">${panel('Tanya LEO','Bertanya tentang pekerjaan hari ini.',null,`<div style="padding:0 18px 18px"><div class="big-summary" style="background:#f1f5f1"><div class="square-ico green" style="width:53px;height:53px">${ico('sparkles',26)}</div><div><h3 style="font-size:17px">Halo, saya LEO.</h3><p>Silakan tanyakan informasi yang tersedia sesuai role Anda. Saya tidak membuat keputusan medis maupun keselamatan.</p></div></div><div style="margin:17px 0" class="vstack">${suggestions.map(q=>`<button class="btn" style="justify-content:flex-start;white-space:normal;text-align:left" data-question="${esc(q)}">${ico('sparkles',15)} ${esc(q)}</button>`).join('')}</div><form id="leoForm" class="gap10"><input id="leoText" placeholder="Tulis pertanyaan tentang daycare..." value="${esc(appState.leoQuery)}" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:12px;outline:0;font-size:12px"><button class="btn primary" type="submit">${ico('send',15)} Tanya</button></form><div id="leoAnswer" style="margin-top:14px"></div></div>`)}${panel('Sumber informasi','Role-aware data scoping.',null,`<div style="padding:0 18px 18px">${[owner?'Kapasitas & CRM':'Aktivitas yang diizinkan',parent?'Catatan Alya':'Anak / staf sesuai akses',parent?'Status penjemput Alya':'Izin / insiden sesuai akses'].map(x=>`<div class="action-row" style="padding:10px 0">${miniIcon('check','green')}<span class="small semi">${x}</span></div>`).join('')}<div class="callout" style="margin-top:10px">Keluaran LEO dalam prototype berbasis rule sederhana pada data contoh, bukan panggilan API generatif. Untuk produksi, sumber dan permission harus diverifikasi server-side.</div></div>`)}</div></div>`}

 }else if(tab==='cameras'){
 content=`<div class="camera-grid three">${db.cameras.map(c=>`<article class="camera-card"><div class="camera-preview">${imageFallback(c.id==='CAM1'?'daycare-room.webp':c.id==='CAM2'?'caregiver-classroom.webp':'group-care.webp')}<div class="camera-watermark">TIDAK ADA LIVE FEED</div></div><div class="camera-card-body"><div class="between"><b>${esc(c.name)}</b>${pill('Next','amber')}</div><p>${esc(c.map)} · ${esc(c.area)}</p><p>${esc(c.purpose)}</p>${btn('Edit mapping',`cameramap-${c.id}`,'btn small primary')}</div></article>`).join('')}</div><div class="callout" style="margin-top:15px">RTSP, ONVIF, gateway, streaming, dan AI analytics tetap menggunakan backend Elenio yang sudah tersedia. Di HTML ini yang dibuat hanya tampilan dan record mapping simulasi, tidak ada URL kamera atau kredensial tersimpan.</div>`;
 }else if(tab==='events'){
 content=`<div class="panel"><div class="panel-head"><div><h3>Antrean AI Event Review</h3><p>Contoh alur: event → review staf → tindak lanjut/insiden → audit</p></div>${pill('Skenario demo · belum ada event aktual','amber')}</div><div class="filterline" style="padding:0 18px 16px">${cameraAreas().map(area=>`<button data-action="camfilter-${esc(area)}" class="chip ${appState.cameraFilter===area?'selected':''}">${esc(area)}</button>`).join('')}</div>${table(['Event','Area','Waktu','Status','Aksi'],events.map(ev=>`<tr><td><b>${esc(ev.name)}</b><p class="tiny muted">${esc(ev.type)} · ${esc(ev.id)}</p></td><td>${esc(ev.area)}</td><td>${esc(ev.time)}</td><td>${pill(ev.status,ev.status==='Belum ditinjau'?'amber':'green')}</td><td>${btn('Review',`cameraevent-${ev.id}`,'btn small')}</td></tr>`))}</div><div class="sidebar-note" style="margin-top:14px">${miniIcon('shield','blue')}<div><h4>Manusia tetap mengambil keputusan</h4><p>Setiap event harus punya referensi sah dari Elenio saat integrasi nanti. Event simulasi tidak boleh dianggap sebagai bukti video atau penilaian keselamatan anak.</p></div></div>`;

function renderContent(){let page=appState.page;switch(page){case'pulse':return ownerPulseExtended();case'crm':return crm();case'family':return family();case'booking':return booking();case'finance':return finance();case'quality':return quality();case'reports':return reports();case'control':return controlExtended();case'children':return managerChildren();case'schedules':return schedules();case'review':return review();case'pickup':return pickupPage();case'development':return development();case'messages':return messages();case'today':return caregiverToday();case'quickcare':return quickCare();case'handover':return handover();case'mychild':return parentHome();case'story':return parentStory();case'parentbooking':return parentBooking();case'parentpickup':return parentPickup();case'leo':return leo();case'integrations':return integrations();case'parentcamera':return parentCamera();case'settings':return settings();default:return ownerPulseExtended()}}

function openModal(type,data={}){appState.modal={type,...data};drawModal()}
function closeModal(){appState.modal=null;drawModal()}
function field(id,label,value='',type='text',other=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" name="${id}" value="${esc(value)}" type="${type}" ${other}></div>`}
function selectField(id,label,options,selected=''){return `<div class="field"><label for="${id}">${label}</label><select name="${id}" id="${id}">${options.map(o=>{let [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${selected===v?'selected':''}>${esc(t)}</option>`}).join('')}</select></div>`}
function area(id,label,value='',placeholder=''){return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" name="${id}" placeholder="${esc(placeholder)}">${esc(value)}</textarea></div>`}
function checkField(id,text){return `<label class="gap10 small" style="line-height:1.5"><input type="checkbox" name="${id}" id="${id}" value="yes" required style="accent-color:#527765;width:17px;height:17px;flex:0 0 17px">${text}</label>`}
function modalForm(type,title,intro,body,submit='Simpan',extra='',submitClass='btn primary'){return `<div class="modal-backdrop" data-action="closeModalBackdrop"><div role="dialog" aria-modal="true" aria-label="${esc(title)}" class="modal"><div class="modal-head"><div><h2>${title}</h2>${intro?`<p class="panel-sub">${intro}</p>`:''}</div><button class="close" data-action="closeModal" aria-label="Tutup">${ico('plus',19).replace('<svg','<svg style="transform:rotate(45deg)"')}</button></div><form id="modalForm" data-form="${type}"><div class="modal-body form">${body}${extra}</div><div class="modal-foot"><button type="button" class="btn" data-action="closeModal">Batal</button><button class="${submitClass}" type="submit">${esc(submit)} ${ico('arrow',15)}</button></div></form></div></div>`}
function modalInfo(title,intro,body,actions=''){return `<div class="modal-backdrop" data-action="closeModalBackdrop"><div role="dialog" aria-modal="true" aria-label="${esc(title)}" class="modal"><div class="modal-head"><div><h2>${title}</h2>${intro?`<p class="panel-sub">${intro}</p>`:''}</div><button class="close" data-action="closeModal" aria-label="Tutup">${ico('plus',19).replace('<svg','<svg style="transform:rotate(45deg)"')}</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn" data-action="closeModal">Tutup</button>${actions}</div></div></div>`}
async function compressChildPhoto(file){
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Format harus JPG, PNG, atau WebP.');
 if(file.size>5*1024*1024)throw new Error('Ukuran maksimal foto 5 MB.');
 const bitmap=await createImageBitmap(file);
 try { const scale=Math.min(1,480/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));let context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(bitmap,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',0.79); }
 finally {bitmap.close();}
}

function drawModal(){let r=document.getElementById('modal-root');if(r)r.innerHTML=getModalHTML(appState.modal)}
function openGeneric(title){openModal('generic',{title})}
function copyText(str){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(str).then(()=>toast('Teks berhasil disalin')).catch(()=>toast('Silakan salin teks secara manual'));else{const ta=document.createElement('textarea');ta.value=str;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();try{document.execCommand('copy');toast('Teks berhasil disalin')}catch{toast('Salin manual dari modal')}ta.remove()}}
function exportData(name,value,kind='application/json'){let blob=new Blob([typeof value==='string'?value:JSON.stringify(value,null,2)],{type:kind});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function csvExport(name,headers,rows){let csv=[headers,...rows].map(line=>line.map(cell=>'"'+String(cell??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');exportData(name,'\ufeff'+csv,'text/csv;charset=utf-8')}
function leoAnswer(question){const q=question.toLowerCase(),role=appState.role;let msg='',sources=[];
 if(role==='parent'){
 if(/makan|siang|food/.test(q)){let a=db.activities.filter(x=>x.child==='C1'&&x.type==='Makan'&&x.published).slice(-1)[0];msg=a?`Menurut catatan pengasuh pukul ${a.time}, Alya ${a.result.toLowerCase()}. ${a.note}`:'Belum ada catatan makan Alya yang diterbitkan.';sources=a?['Activity '+a.id+' · published']:[]}
 else if(/tidur/.test(q)){let a=db.activities.filter(x=>x.child==='C1'&&x.type==='Tidur'&&x.published).slice(-1)[0];msg=a?`Catatan tidur Alya: ${a.result}. ${a.note}`:'Belum ada catatan tidur terbit.';sources=a?['Activity '+a.id]:[]}
 else if(/jemput/.test(q)){msg=`Penjemput Alya yang ditampilkan sebagai berizin: ${db.pickups.filter(p=>p.child==='C1'&&p.status==='valid').map(p=>p.person+' ('+p.relation+')').join(', ')||'Tidak ada yang tercatat'}. Staf tetap wajib memverifikasi saat kedatangan.`;sources=['Pickup authorization · Alya']}
 else {msg='Saya dapat menjawab berdasarkan aktivitas Alya yang sudah diterbitkan. Coba tanyakan makanan, tidur, atau izin penjemput.';sources=['Parent-scoped daily records']}
 }else if(/slot|kapasitas|booking/.test(q)){msg=`Ketersediaan saat ini: ${db.capacities.map(c=>`${c.name} ${c.total-c.filled} slot`).join('; ')}. Angka hanya kapasitas; verifikasi jadwal staf sebelum menerima booking.`;sources=['Capacity records · 3 kelas']}
 else if(/prospek|crm|follow|jualan/.test(q)){msg=`Ada ${db.leads.filter(l=>l.status!=='Terdaftar').length} prospek aktif. Prioritaskan ${db.leads.filter(l=>l.status==='Baru'||l.status==='Penawaran').map(l=>l.name).join(' dan ')||'prospek terbaru'} berdasarkan next action. WhatsApp tidak terkirim otomatis.`;sources=['CRM pipeline · lead records']}
 else if(/aktivitas|terbit|laporan/.test(q)){msg=`Ada ${db.activities.filter(a=>!a.published).length} catatan menunggu publish. Pengelola meninjau sesuai kebijakan sebelum orang tua melihatnya.`;sources=['Care activity records']}
 else if(/instruksi|alergi|kelas/.test(q)){msg=`Instruksi yang perlu diperhatikan: ${db.children.filter(c=>c.class==='Toddler A'&&!c.care.startsWith('Tidak ada')).map(c=>`${c.name}: ${c.care}`).join('; ')}. Ikuti SOP dan verifikasi informasi dengan staf berwenang.`;sources=['Care Passport · assigned class']}
 else if(/izin|jemput/.test(q)){msg=`Ada ${db.approvals.filter(a=>a.kind==='Pickup'&&a.status==='pending').length} izin pengganti perlu review. Jangan lakukan serah-terima sebelum otorisasi dan identitas diverifikasi staf.`;sources=['Pickup approvals']}
 else {msg=`Prioritas contoh: ${db.approvals.filter(x=>x.status==='pending').length} exception perlu review, ${db.activities.filter(a=>!a.published).length} aktivitas belum terbit, ${db.leads.filter(x=>x.status==='Baru').length} prospek baru untuk follow-up, dan ${db.capacities.reduce((a,c)=>a+c.total-c.filled,0)} slot tersedia.`;sources=['Approval queue','Activity logs','CRM leads','Capacity records']}
 return {message:msg,sources}}
function answerLeo(question){if(!question.trim())return;let a=leoAnswer(question);let box=document.getElementById('leoAnswer');if(box)box.innerHTML=`<div class="sidebar-note">${miniIcon('sparkles','green')}<div><h4>LEO · jawaban berdasarkan record</h4><p>${esc(a.message)}</p><div class="gap6 wrap" style="margin-top:11px">${a.sources.map(s=>pill(s,'blue')).join('')}</div><p class="tiny" style="margin-top:10px">Simulasi dari data di browser, bukan model generatif live.</p></div></div>`}

 if(v('bkStatus')==='Reservasi slot sementara'){db.actions.unshift({type:'slot-reserved-demo',name,class:v('bkClass'),start:v('bkStart'),status:'review'});toast('Reservasi simulasi dibuat','Belum menjadi enrollment atau mengurangi slot sebelum dikonfirmasi.');closeModal();return}
 if(isNew)cl.filled++;
 if(isNew)db.children.push({id,name,age:'2 tahun',class:cl.name,guardian:v('bkParent'),care:'Data perawatan perlu dilengkapi oleh wali',present:false,photo:'',authorized:[],package:v('bkPlan'),status:'Dalam onboarding',photoConsent:false,emergency:'',onboardingCreated:true});
 let lead=db.leads.find(l=>l.id===v('bkLead'));if(lead){lead.status='Terdaftar';lead.next='Kirim undangan family onboarding'}
 const mult={'Full Day':1,'Half Day':.6,'3 Hari':.8,'Drop-in Harian':.09}[v('bkPlan')]||1;

function bindGlobalEvents(){document.addEventListener('click',e=>{
 let page=e.target.closest('[data-page]');if(page){navigate(page.dataset.page);return}
 let filter=e.target.closest('[data-filter]');if(filter){appState.filter=filter.dataset.filter;render();return}
 let date=e.target.closest('[data-date]');if(date){appState.selectedDate=date.dataset.date;render();return}
 let question=e.target.closest('[data-question]');if(question){appState.leoQuery=question.dataset.question;let field=document.getElementById('leoText');if(field)field.value=appState.leoQuery;answerLeo(appState.leoQuery);return}
 let action=e.target.closest('[data-action]');if(!action)return;
 if(action.dataset.action==='closeModalBackdrop'){if(e.target===action)closeModal();return}
 handleAction(action.dataset.action)
 });document.addEventListener('change',e=>{let el=e.target;switch(el.id){case'roleSelect':switchRole(el.value);return;case'childSelect':appState.selectedChild=el.value;render();return;case'quickClass':db.selectedClass=el.value;db.selectedKids=db.children.filter(c=>c.class===el.value).map(c=>c.id);db.activityExcept=db.selectedKids[0]||'';save();render();return;case'activityResult':db.activityResult=el.value;save();return;case'exceptChild':db.activityExcept=el.value;save();return;case'exceptResult':db.activityExceptResult=el.value;save();return;}});document.addEventListener('input',e=>{if(e.target.id==='search'){appState.search=e.target.value;let pos=e.target.selectionStart;render();let n=document.getElementById('search');if(n){n.focus();n.setSelectionRange(pos,pos)}}});document.addEventListener('submit',e=>{if(e.target.id==='modalForm'){handleModalSubmit(e);return}if(e.target.id==='leoForm'){e.preventDefault();answerLeo(document.getElementById('leoText').value);return}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&appState.modal)closeModal()});}
document.addEventListener('change',e=>{
 const el=e.target;if(el?.id==='profilePhoto'||el?.id==='newChildPhoto'){
  const f=el.files?.[0];const target=document.getElementById('photoUploadPreview');if(!f||!target)return;
  if(f.type.startsWith('image/')){const blob=URL.createObjectURL(f);target.innerHTML=`<img src="${blob}" alt="Preview foto anak yang dipilih">`;setTimeout(()=>URL.revokeObjectURL(blob),8000)}
 }
});

const fmtShort = n => new Intl.NumberFormat('id-ID',{notation:'compact',maximumFractionDigits:1}).format(n);
const invoiceTotals=()=>({paid:db.invoices.filter(i=>i.status==='Lunas').reduce((s,x)=>s+x.amount,0),due:db.invoices.filter(i=>i.status==='Jatuh Tempo').reduce((s,x)=>s+x.amount,0),pending:db.invoices.filter(i=>i.status==='Menunggu').reduce((s,x)=>s+x.amount,0)});
const occupancy=()=>({filled:db.capacities.reduce((s,x)=>s+x.filled,0),total:db.capacities.reduce((s,x)=>s+x.total,0)});
function statCard(label,value,detail,kind,icon='chart',action=''){
 return `<article class="v6-stat ${kind}"><div class="v6-stat-label">${esc(label)}<span class="v6-stat-icon">${ico(icon,18)}</span></div><div class="v6-stat-num">${esc(value)}</div><div class="v6-stat-detail">${esc(detail)}</div>${action?`<button class="v6-stat-link" data-page="${esc(action)}">Lihat detail ${ico('arrow',14)}</button>`:''}</article>`;
}
function v6Action(icon,title,desc,nav,button='Tinjau',color=''){
 return `<div class="v6-action-line"><div class="v6-action-icon ${color}">${ico(icon,19)}</div><div class="v6-action-info"><strong>${esc(title)}</strong><span>${esc(desc)}</span></div><button class="btn small" data-action="${esc(nav)}">${esc(button)} ${ico('arrow',13)}</button></div>`;
}
function capacityGraph(){let max=Math.max(...db.capacities.map(x=>x.total),1);return `<div class="v6-cap-chart">${db.capacities.map(c=>{let fill=Math.max(0,Math.min(100,(c.filled/c.total)*100));return `<div class="v6-cap-row"><div class="v6-cap-label"><strong>${esc(c.name)}</strong><span>${esc(c.age)}</span></div><div class="v6-cap-meters"><div class="v6-cap-bar"><div style="width:${fill}%"></div></div><span>${c.filled}/${c.total}</span></div><div class="v6-cap-free">${c.total-c.filled} slot</div></div>`}).join('')}</div>`}
function revenueGraph(){const a=invoiceTotals(),all=Math.max(1,a.paid+a.due+a.pending);const rows=[['Sudah dibayar',a.paid,'paid'],['Lewat jatuh tempo',a.due,'due'],['Menunggu pembayaran',a.pending,'pending']];return `<div class="v6-revenue-plot"><div class="v6-rev-total"><div><span>Total invoice tercatat</span><strong>${money(a.paid+a.due+a.pending)}</strong></div><div class="v6-rev-note">Oktober · dataset contoh</div></div><div class="v6-rev-stacked">${rows.map(([n,v,c])=>`<span class="${c}" style="width:${100*v/all}%" title="${esc(n)} ${money(v)}"></span>`).join('')}</div>${rows.map(([n,v,c])=>`<div class="v6-rev-legend"><i class="${c}"></i><span>${n}</span><b>${money(v)}</b></div>`).join('')}</div>`}
function funnelGraph(){const steps=['Baru','Survei','Trial','Penawaran','Waitlist','Terdaftar'];let max=Math.max(1,...steps.map(x=>db.leads.filter(l=>l.status===x).length));return `<div class="v6-funnel">${steps.map(s=>{const count=db.leads.filter(l=>l.status===s).length;return `<div class="v6-funnel-item"><span>${s}</span><div class="v6-funnel-track"><i style="width:${Math.max(0,count/max*100)}%"></i></div><b>${count}</b></div>`}).join('')}</div>`}
function v6Insights(){const a=invoiceTotals();const baby=db.capacities.find(x=>x.name==='Baby'),tod=db.capacities.find(x=>x.name==='Toddler A');const wait=db.leads.find(x=>x.status==='Waitlist');const early=db.leads.filter(x=>x.status==='Baru'||x.status==='Penawaran');return `<div class="v6-insight-list">${tod && tod.total>tod.filled?`<article><div class="v6-insight-number">01</div><div><b>Isi ${tod.total-tod.filled} slot Toddler yang tersedia</b><p>${early.length} prospek baru/penawaran dapat ditinjau untuk dicocokkan dengan jadwal.</p></div><button data-page="crm">Lihat prospek ${ico('arrow',15)}</button></article>`:''}${a.due?`<article><div class="v6-insight-number">02</div><div><b>Periksa ${money(a.due)} yang melewati jatuh tempo</b><p>Hubungi keluarga dan verifikasi transaksi sebelum mengubah status invoice.</p></div><button data-page="finance">Cek tagihan ${ico('arrow',15)}</button></article>`:''}${wait && baby?`<article><div class="v6-insight-number">03</div><div><b>Waitlist kelas Baby perlu follow-up</b><p>${baby.total-baby.filled} slot tersisa. Verifikasi usia, kesiapan staf, dan jadwal ${wait.child} sebelum menawarkan tempat.</p></div><button data-page="booking">Cek kapasitas ${ico('arrow',15)}</button></article>`:''}${db.approvals.some(x=>x.status==='pending')?`<article><div class="v6-insight-number">04</div><div><b>${db.approvals.filter(x=>x.status==='pending').length} permintaan operasional memerlukan review</b><p>Penjemputan pengganti dan insiden perlu pemeriksaan staf yang berwenang.</p></div><button data-page="quality">Buka safety ${ico('arrow',15)}</button></article>`:''}</div>`}

 <section class="ai-command"><div class="ai-command-icon">${ico('sparkles',27)}</div><div class="ai-command-main"><span class="ai-eyebrow">TANYA LEO · WORKFLOW COPILOT</span><h2>Apa yang ingin kamu selesaikan hari ini?</h2><p>Contoh: “Siapkan follow-up prospek dan cek slot daycare yang masih tersedia.”</p><form id="aiPromptForm"><input id="aiPrompt" placeholder="Tulis instruksi tentang prospek, invoice, aktivitas, atau pickup…" autocomplete="off" aria-label="Instruksi LEO"/><button type="submit">Cari tindakan ${ico('arrow',17)}</button></form><div class="ai-prompt-chips">${agentQuestions.filter(a=>appState.role==='owner'||a[1]!=='finance'&&a[1]!=='growth').map(([label,type])=>`<button type="button" data-ai="filter" data-ai-filter="${type}">${esc(label)}</button>`).join('')}</div></div><div class="ai-command-orb">${ico('sparkles',35)}<span>Identify<br>Prepare<br>Approve</span></div></section>
 <div class="ai-workspace"><section class="ai-work-main"><div class="ai-section-head"><div><span class="ai-eyebrow">ACTION CENTER</span><h2>Pekerjaan yang bisa dibantu LEO</h2><p>Rekomendasi berubah mengikuti data contoh saat kamu membuat booking, aktivitas, atau mengubah status.</p></div><span class="ai-count">${filter==='all'&&!appState.aiExpand?`${visible.length} prioritas / ${shown.length} total`:`${shown.length} tindakan`}</span></div><div class="ai-tabs">${[['all','Semua'],['growth','Enrollment'],['finance','Billing'],['care','Daily Care'],['safety','Safety'],['operations','Closing']].filter(x=>appState.role==='owner'||!['growth','finance'].includes(x[0])).map(([id,title])=>`<button class="${filter===id?'active':''}" data-ai="filter" data-ai-filter="${id}">${title} <span>${id==='all'?selected.length:selected.filter(x=>x.kind===id).length}</span></button>`).join('')}</div><div class="ai-task-list">${visible.length?cards(visible):`<div class="ai-nothing">${ico('check',28)}<h3>Tidak ada tindakan dalam kategori ini</h3><p>Coba pilih kategori lain atau jalankan skenario pada modul terkait.</p></div>`}${shown.length>visible.length?`<div class="ai-show-more"><button data-ai="expand">Lihat ${shown.length-visible.length} rekomendasi lainnya ${ico('down',16)}</button></div>`:''}</div></section>
 <aside class="ai-side"><section class="ai-guardrail"><span class="ai-eyebrow">HUMAN-IN-CONTROL</span><h3>Otomatisasi yang bisa dipercaya</h3><div class="ai-flow"><div><i>01</i><span><b>Identifikasi</b><small>Baca data yang memang diizinkan</small></span></div><div><i>02</i><span><b>Siapkan</b><small>Draf pesan, brief, atau rekomendasi</small></span></div><div><i>03</i><span><b>Konfirmasi</b><small>Staf memeriksa fakta & persetujuan</small></span></div><div><i>04</i><span><b>Catat hasil</b><small>Log tindakan untuk audit</small></span></div></div><div class="ai-trustline">${ico('shield',17)} Tidak ada pengiriman WhatsApp, pemberian obat, keputusan pickup, atau penyimpulan CCTV secara otomatis.</div></section><section class="ai-history"><div class="ai-side-title"><h3>Aktivitas LEO</h3><span>${s.history.length} log</span></div>${s.history.slice(0,5).map(h=>`<div class="ai-history-entry"><span>${ico('check',13)}</span><div><p>${esc(h.desc)}</p><small>${esc(h.when)}</small></div></div>`).join('')||`<div class="ai-history-empty">Belum ada proses. Klik “Pindai ulang” untuk memulai.</div>`}<button data-ai="history">Lihat semua catatan ${ico('arrow',14)}</button></section></aside></div>
 <div class="ai-footer-note">${ico('alert',16)} <span>* Data CCTV/Video Analytics hanya simulasi alur review. HTML ini tidak memakai AI generatif, tidak terhubung WhatsApp Business API, Elenio CCTV, gateway pembayaran, atau data anak nyata. Aksi dan log disimpan lokal di browser untuk review UX.</span></div>`;}
 function showDialog(x){const prepared=aiState().work[x.id]?.draft??x.draft,story=x.id.startsWith('story:');appState.aiDialog={id:x.id};const root=document.getElementById('modal-root');if(root)root.innerHTML=dialogHTML(x,prepared,story);}
 function dialogHTML(x,draft,story){const st=workStatus(x.id);const isManager=appState.role==='manager';return `<div class="modal-backdrop ai-modal-backdrop" data-ai="backdrop"><div class="ai-modal" role="dialog" aria-modal="true" aria-label="Tinjau tindakan LEO"><header><div><span class="ai-eyebrow">LEO AUTOMATION · ${esc(TYPES[x.kind][0])}</span><h2>${esc(x.title)}</h2><p>${esc(x.desc)}</p></div><button data-ai="close" aria-label="Tutup dialog">×</button></header><div class="ai-modal-body"><div class="ai-source"><span>${ico('file',15)} SUMBER DATA</span><p>${esc(x.source)}</p></div><div class="ai-draft-label"><strong>${story?'Draf cerita anak':'Draf tindakan / pesan'}</strong><span>${ico('lock',14)} Belum dieksekusi</span></div><textarea id="aiDraftText" rows="7" maxlength="1600" aria-label="Draf hasil kerja LEO">${esc(draft)}</textarea><div class="ai-require">${ico('shield',17)}<div><b>Persetujuan manusia wajib</b><p>${esc(x.requires)}</p></div></div>${story&&isManager?`<div class="ai-approval-info">Ringkasan yang dipublikasikan baru terlihat oleh wali anak terkait. Catatan sumber harus tetap berstatus published.</div>`:''}</div><footer><button class="btn" data-ai="close">Batal</button><button class="btn" data-ai="go" data-ai-id="${esc(x.id)}">Buka modul</button>${story&&isManager?`<button class="btn primary" data-ai="publish-story" data-ai-id="${esc(x.id)}">${ico('check',15)} Review & publikasikan</button>`:`<button class="btn primary" data-ai="prepare" data-ai-id="${esc(x.id)}">${ico('clipboard',15)} ${st==='prepared'?'Perbarui draf':'Simpan draf'}</button>`}</footer>${!story?`<div class="ai-modal-after"><button data-ai="copy" data-ai-id="${esc(x.id)}">${ico('clipboard',14)} Salin draf</button><button data-ai="manual-done" data-ai-id="${esc(x.id)}">${ico('check',14)} Tandai tindakan manual selesai</button><button data-ai="dismiss" data-ai-id="${esc(x.id)}">Abaikan saran</button></div>`:''}</div></div>`;}
 function drawAIDialog(){const x=candidateBy(appState.aiDialog.id);if(!x){appState.aiDialog=null;return;}const root=document.getElementById('modal-root');if(root)root.innerHTML=dialogHTML(x,aiState().work[x.id]?.draft??x.draft,x.id.startsWith('story:'));}
 function close(){appState.aiDialog=null;const root=document.getElementById('modal-root');if(root)root.innerHTML='';}
 function storeDraft(x){const el=document.getElementById('aiDraftText');const draft=el?.value.trim()??x.draft;if(!draft){toast('Draf tidak boleh kosong');return null;}const s=aiState();s.work[x.id]={...(s.work[x.id]||{}),status:'prepared',draft,updated:when()};save();record(`Draf disiapkan: ${x.title}`);return draft;}
 async function copyText(v){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(v);return true;}}catch(e){}const area=document.createElement('textarea');area.value=v;area.style.position='fixed';area.style.left='-9999px';document.body.appendChild(area);area.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}area.remove();return ok;}
 function aiAction(el){const op=el.dataset.ai,id=el.dataset.aiId,x=id?candidateBy(id):null;
  if(op==='backdrop'){close();return;}
  if(op==='close'){close();return;}
  if(op==='view'){appState.aiView=el.dataset.aiView;render();return;}
  if(op==='filter'){appState.aiFilter=el.dataset.aiFilter;appState.aiExpand=false;render();return;}
  if(op==='expand'){appState.aiExpand=true;render();return;}
  if(op==='scan'){const s=aiState();s.scanCount++;s.lastScan=when();record(`Pemindaian simulasi #${s.scanCount}: ${buildCandidates(appState.role).filter(x=>!isMuted(x.id)).length} pekerjaan ditemukan`);render();toast('Pemindaian selesai','Saran diambil dari data lokal; belum menjalankan AI eksternal.');return;}
  if(op==='open'&&x){showDialog(x);return;}
  if(op==='go'&&x){const target=x.module;close();navigate(target);return;}
  if(op==='prepare'&&x){if(storeDraft(x)!==null){close();render();toast('Draf tersimpan','Belum ada tindakan eksternal yang dieksekusi.')}return;}
  if(op==='copy'&&x){const v=storeDraft(x);if(v===null)return;copyText(v).then(ok=>toast(ok?'Draf berhasil disalin':'Draf disiapkan','Tidak ada pesan terkirim. Salin manual dari isi draf bila diperlukan.'));return;}
  if(op==='manual-done'&&x){const v=document.getElementById('aiDraftText')?.value.trim();if(!v){toast('Isi draf harus diperiksa terlebih dahulu');return;}const confirmed=window.confirm('Konfirmasi bahwa tindakan sudah dilakukan secara MANUAL di luar demo. Ini tidak mengirim pesan atau mengubah status pembayaran/penjemputan. Lanjutkan?');if(!confirmed)return;aiState().work[x.id]={status:'done',draft:v,updated:when()};record(`Pengguna menandai tindak lanjut manual: ${x.title}`);save();close();render();toast('Tindak lanjut manual dicatat','Sistem tidak mengirim WhatsApp atau mengubah pembayaran.');return;}
  if(op==='dismiss'&&x){aiState().work[x.id]={status:'dismissed',draft:x.draft,updated:when()};record(`Saran diabaikan: ${x.title}`);save();close();render();return;}
  if(op==='publish-story'&&x){if(appState.role!=='manager'){toast('Publikasi hanya oleh pengelola');return;}const txt=document.getElementById('aiDraftText')?.value.trim();if(!txt||txt.length<30){toast('Lengkapi cerita sebelum diterbitkan','Setidaknya 30 karakter, harus mengacu pada catatan pengasuh.');return;}const verified=db.activities.filter(a=>a.child===x.child&&a.published);if(!verified.length||x.sourceIds.some(id=>!verified.some(a=>a.id===id))){toast('Sumber berubah','Review data terbit yang valid sebelum publish.');return;}db.aiPublishedStories=db.aiPublishedStories.filter(z=>z.child!==x.child);db.aiPublishedStories.push({child:x.child,text:txt,sourceIds:x.sourceIds,by:'Nadia (Pengelola)',at:when()});aiState().work[x.id]={status:'done',draft:txt,updated:when()};record(`Daily Story ${childBy(x.child).name} direview & dipublikasikan oleh pengelola`);save();close();render();toast('Daily Story terbit','Orang tua berwenang dapat melihatnya.');return;}
  if(op==='history'){const hist=aiState().history;const str=hist.length?hist.map(h=>`${h.when} — ${h.desc}`).join('\n'):'Belum ada aktivitas';const blob=new Blob([str],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='daylio-leo-demo-activity.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Riwayat lokal diekspor','Ini data simulasi, bukan audit produksi.');return;}
 }
 document.addEventListener('click',e=>{const el=e.target.closest('[data-ai]');if(el){e.preventDefault();e.stopImmediatePropagation();if(el.dataset.ai==='backdrop'&&e.target!==el)return;aiActionWithEvent(el,e);}},true);

 aiState();
